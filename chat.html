<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - AURA Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
        }

        /* ─── HEADER ────────────────────────────────────────────── */
        .header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }

        .header .back {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }

        .header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(139, 92, 246, 0.2);
        }

        .header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header .avatar i {
            font-size: 18px;
            color: #8B5CF6;
        }

        .header .info {
            flex: 1;
            min-width: 0;
        }

        .header .info .name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .info .status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .header .info .status.online {
            color: #06B6D4;
        }

        .header .info .status.typing {
            color: #06B6D4;
            font-style: italic;
        }

        .header .actions {
            display: flex;
            gap: 4px;
        }

        .header .actions button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.3s ease;
        }

        .header .actions button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ─── BLOCKED BANNER ──────────────────────────────────────── */
        .blocked-banner {
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border-bottom: 1px solid rgba(239, 68, 68, 0.2);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .blocked-banner.show { display: flex; }
        .blocked-banner i { color: #ef4444; font-size: 16px; }
        .blocked-banner span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        /* ─── CHAT DISABLED ──────────────────────────────────────── */
        .chat-disabled {
            padding: 8px 16px;
            background: rgba(245, 158, 11, 0.15);
            border-bottom: 1px solid rgba(245, 158, 11, 0.2);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-disabled.show { display: flex; }
        .chat-disabled i { color: #f59e0b; font-size: 16px; }
        .chat-disabled span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        /* ─── PINNED BANNER ──────────────────────────────────────── */
        .pinned-banner {
            padding: 10px 16px;
            background: rgba(26, 16, 60, 0.9);
            border-bottom: 1px solid rgba(255, 165, 0, 0.3);
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .pinned-banner.show { display: flex; }
        .pinned-banner i { color: rgba(255, 165, 0, 0.8); font-size: 16px; }
        .pinned-banner .text {
            flex: 1;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pinned-banner .close-pin {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 16px;
        }

        /* ─── TYPING INDICATOR ────────────────────────────────────── */
        .typing-indicator {
            padding: 6px 16px 10px;
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .typing-indicator.show { display: flex; }
        .typing-indicator .dots {
            display: flex;
            gap: 4px;
        }
        .typing-indicator .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8B5CF6;
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }
        .typing-indicator .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        /* ─── MESSAGES ───────────────────────────────────────────── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 0;
        }

        .messages .date-divider {
            text-align: center;
            padding: 8px 16px;
            margin: 8px 0 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            align-self: center;
        }

        .msg {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 85%;
        }

        .msg.me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            font-size: 12px;
            font-weight: 600;
            color: #8B5CF6;
        }

        .msg .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            max-width: 100%;
            position: relative;
        }

        .msg .bubble .sender {
            font-size: 12px;
            font-weight: 600;
            color: #8B5CF6;
            margin-bottom: 4px;
            display: block;
        }

        .msg:not(.me) .bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-bottom-left-radius: 4px;
            color: rgba(255, 255, 255, 0.9);
        }

        .msg.me .bubble {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .msg .bubble .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .msg.me .bubble .time {
            color: rgba(255, 255, 255, 0.6);
        }

        .msg .bubble .reply-preview {
            padding: 8px;
            border-left: 3px solid #8B5CF6;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .msg .bubble .reply-preview .reply-sender {
            color: #8B5CF6;
            font-weight: 600;
        }

        .msg .bubble .reply-preview .reply-text {
            color: rgba(255, 255, 255, 0.5);
        }

        .msg .bubble .deleted {
            font-style: italic;
            color: rgba(255, 255, 255, 0.3);
        }

        .msg .bubble img {
            max-width: 200px;
            border-radius: 12px;
            margin-top: 4px;
            cursor: pointer;
        }

        .msg .bubble .voice-note {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 180px;
        }

        .msg .bubble .voice-note .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .msg.me .bubble .voice-note .play-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .msg .bubble .voice-note .duration {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .msg .bubble .file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            cursor: pointer;
        }

        .msg .bubble .file i {
            font-size: 24px;
            color: #8B5CF6;
        }

        .msg .bubble .file .file-info .file-name {
            font-size: 13px;
            font-weight: 500;
        }

        .msg .bubble .file .file-info .file-size {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }

        .msg .reactions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .msg .reactions .reaction {
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* ─── INPUT AREA ────────────────────────────────────────── */
        .input-area {
            padding: 8px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .input-area .reply-bar {
            display: none;
            padding: 8px 12px;
            background: rgba(139, 92, 246, 0.1);
            border-left: 3px solid #8B5CF6;
            border-radius: 8px;
            width: 100%;
            order: -1;
        }

        .input-area .reply-bar .reply-sender {
            font-size: 12px;
            font-weight: 600;
            color: #8B5CF6;
        }

        .input-area .reply-bar .reply-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .input-area .reply-bar .close-reply {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 14px;
        }

        .input-area .attach-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            align-self: center;
        }

        .input-area .emoji-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            align-self: center;
        }

        .input-area .input-wrap {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px 16px;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .input-area .input-wrap textarea {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            resize: none;
            padding: 10px 0;
            min-height: 24px;
            max-height: 100px;
            line-height: 1.5;
        }

        .input-area .input-wrap textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .input-area .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
        }

        .input-area .action-btn:hover { transform: scale(1.05); }
        .input-area .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .input-area .action-btn.recording {
            background: #ef4444;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ─── EMOJI PICKER ───────────────────────────────────────── */
        .emoji-picker {
            display: none;
            background: rgba(26, 16, 60, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            flex-shrink: 0;
            width: 100%;
        }

        .emoji-picker.open { display: block; }
        .emoji-picker .emojis { display: flex; flex-wrap: wrap; gap: 4px; }
        .emoji-picker .emojis span {
            font-size: 28px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }
        .emoji-picker .emojis span:hover { background: rgba(255, 255, 255, 0.05); }

        /* ─── RECORDING INDICATOR ────────────────────────────────── */
        .recording-indicator {
            display: none;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border-top: 1px solid rgba(239, 68, 68, 0.2);
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            width: 100%;
        }

        .recording-indicator.show { display: flex; }
        .recording-indicator .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 1s ease-in-out infinite;
        }
        .recording-indicator .time {
            color: #ef4444;
            font-weight: 600;
            font-size: 14px;
        }
        .recording-indicator .cancel {
            margin-left: auto;
            background: none;
            border: none;
            color: #ef4444;
            font-size: 20px;
            cursor: pointer;
        }
        .recording-indicator .send-recording {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(139, 92, 246, 0.1);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .app { max-width: 100%; }
            .header { padding: 8px 12px; }
            .msg { max-width: 92%; }
            .msg .bubble { font-size: 13px; padding: 8px 12px; }
            .messages { padding: 12px; }
            .input-area { padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="app" id="app">

        <!-- ─── HEADER ────────────────────────────────────────────── -->
        <div class="header">
            <button class="back" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="avatar" id="chatAvatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="info">
                <div class="name" id="chatName">Chat</div>
                <div class="status" id="chatStatus">Loading...</div>
            </div>
            <div class="actions">
                <button onclick="searchMessages()"><i class="fas fa-search"></i></button>
                <button onclick="openMenu()"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </div>

        <!-- ─── BLOCKED BANNER ────────────────────────────────────── -->
        <div class="blocked-banner" id="blockedBanner">
            <i class="fas fa-ban"></i>
            <span id="blockedText">You blocked this user</span>
        </div>

        <!-- ─── CHAT DISABLED ────────────────────────────────────── -->
        <div class="chat-disabled" id="chatDisabled">
            <i class="fas fa-lock"></i>
            <span>Only admins can send messages</span>
        </div>

        <!-- ─── PINNED BANNER ────────────────────────────────────── -->
        <div class="pinned-banner" id="pinnedBanner">
            <i class="fas fa-thumbtack"></i>
            <span class="text" id="pinnedText">Pinned message</span>
            <button class="close-pin" onclick="unpinMessage()"><i class="fas fa-times"></i></button>
        </div>

        <!-- ─── TYPING INDICATOR ────────────────────────────────── -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
            <span class="label">typing...</span>
        </div>

        <!-- ─── MESSAGES ───────────────────────────────────────────── -->
        <div class="messages" id="messages">
            <div style="text-align:center;color:rgba(255,255,255,0.3);padding:40px 0;">
                <div class="loading-spinner"></div>
                Loading messages...
            </div>
        </div>

        <!-- ─── INPUT AREA ──────────────────────────────────────────── -->
        <div class="input-area" id="inputArea">
            <div class="reply-bar" id="replyBar">
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                    <div>
                        <div class="reply-sender" id="replySender">Unknown</div>
                        <div class="reply-text" id="replyText">...</div>
                    </div>
                    <button class="close-reply" onclick="clearReply()"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <button class="attach-btn" onclick="showAttachmentMenu()">
                <i class="fas fa-paperclip"></i>
            </button>
            <button class="emoji-btn" onclick="toggleEmojiPicker()">
                <i class="fas fa-smile"></i>
            </button>
            <div class="input-wrap">
                <textarea id="messageInput" rows="1" placeholder="Type a message..." oninput="onTextChanged(this)"></textarea>
            </div>

            <button class="action-btn" id="actionBtn" onclick="handleAction()">
                <i class="fas fa-microphone"></i>
            </button>
        </div>

        <!-- ─── EMOJI PICKER ───────────────────────────────────────── -->
        <div class="emoji-picker" id="emojiPicker">
            <div class="emojis" id="emojiList"></div>
        </div>

        <!-- ─── RECORDING INDICATOR ───────────────────────────────── -->
        <div class="recording-indicator" id="recordingIndicator">
            <div class="dot"></div>
            <div class="time" id="recordingTime">00:00</div>
            <button class="cancel" onclick="cancelRecording()"><i class="fas fa-trash"></i></button>
            <button class="send-recording" onclick="sendRecording()">Send <i class="fas fa-arrow-right"></i></button>
        </div>

    </div>

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ─── CLOUDINARY CONFIG ──────────────────────────────────────
        const CLOUDINARY_CLOUD_NAME = 'dn2mwp1lc';
        const CLOUDINARY_UPLOAD_PRESET = 'aura_chat';

        // ─── GET CHAT ID FROM URL ────────────────────────────────────
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId');
        let currentUserId = '';
        let chatData = {};
        let replyTo = null;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingSeconds = 0;
        let recordingTimer = null;
        let pinnedMessages = [];
        let showPinned = true;
        let isBlocked = false;
        let iBlockedThem = false;
        let theyBlockedMe = false;
        let canSend = true;
        let isAnnouncementsOnly = false;
        let otherUserTyping = false;

        // ─── DOM REFS ──────────────────────────────────────────────────
        const actionBtn = document.getElementById('actionBtn');
        const messageInput = document.getElementById('messageInput');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const recordingTime = document.getElementById('recordingTime');
        const pinnedBanner = document.getElementById('pinnedBanner');
        const pinnedText = document.getElementById('pinnedText');
        const messagesEl = document.getElementById('messages');
        const chatNameEl = document.getElementById('chatName');
        const chatStatusEl = document.getElementById('chatStatus');
        const chatAvatarEl = document.getElementById('chatAvatar');
        const blockedBanner = document.getElementById('blockedBanner');
        const blockedText = document.getElementById('blockedText');
        const chatDisabled = document.getElementById('chatDisabled');
        const typingIndicator = document.getElementById('typingIndicator');

        // ─── TEXT CHANGE HANDLER ──────────────────────────────────────
        function onTextChanged(el) {
            const hasText = el.value.trim().length > 0;
            if (hasText) {
                actionBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                actionBtn.classList.remove('recording');
                actionBtn.title = 'Send message';
            } else {
                actionBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                actionBtn.classList.remove('recording');
                actionBtn.title = 'Hold to record voice message';
            }
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        }

        // ─── HANDLE ACTION BUTTON ────────────────────────────────────
        function handleAction() {
            const hasText = messageInput.value.trim().length > 0;
            if (hasText) {
                sendMessage();
            } else {
                if (isRecording) {
                    stopRecording();
                } else {
                    startRecording();
                }
            }
        }

        // ─── LOCAL STORAGE HELPERS ────────────────────────────────────
        function getLocal(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }

        // ─── AUTH ──────────────────────────────────────────────────────
        function getUserId() {
            const user = auth.currentUser;
            if (user) return user.uid;
            return getLocal('mock_user_id') || null;
        }

        auth.onAuthStateChanged(function(user) {
            const id = getUserId();
            if (id) {
                currentUserId = id;
                console.log('✅ User found:', currentUserId);
                loadChat();
            } else {
                messagesEl.innerHTML = `
                    <div style="text-align:center;color:rgba(255,255,255,0.3);padding:40px 0;">
                        <i class="fas fa-user-slash" style="font-size:48px;display:block;margin-bottom:16px;"></i>
                        Not signed in<br/>
                        <span style="font-size:13px;">Please sign in to view messages</span>
                    </div>
                `;
            }
        });

        // ─── LOAD CHAT ─────────────────────────────────────────────────
        async function loadChat() {
            if (!chatId || !currentUserId) return;

            try {
                const doc = await db.collection('chats').doc(chatId).get();
                if (!doc.exists) {
                    messagesEl.innerHTML = '<div style="text-align:center;color:red;padding:40px;">Chat not found</div>';
                    return;
                }

                chatData = doc.data();
                const participants = chatData.participants || [];
                const isGroup = chatData.type === 'group' || chatData.type === 'channel';
                const chatType = chatData.type || 'direct';

                // Get chat name and avatar
                let chatName = chatData.name || 'Chat';
                let chatAvatar = chatData.avatar_url || null;

                if (!isGroup && chatType === 'direct') {
                    const otherId = participants.find(id => id !== currentUserId);
                    if (otherId) {
                        const userDoc = await db.collection('users').doc(otherId).get();
                        if (userDoc.exists) {
                            const userData = userDoc.data();
                            chatName = userData.display_name || userData.username || 'Unknown';
                            chatAvatar = userData.avatar_url || null;
                        }
                    }
                }

                // Update header
                chatNameEl.textContent = chatName;
                if (chatAvatar) {
                    chatAvatarEl.innerHTML = `<img src="${chatAvatar}" />`;
                } else {
                    chatAvatarEl.innerHTML = `<i class="fas ${isGroup ? 'fa-users' : 'fa-user'}"></i>`;
                }

                // Check block status
                await checkBlockStatus();

                // Load settings
                const settings = chatData.settings || {};
                const myRole = chatData.participants_data?.[currentUserId]?.role || 'member';
                const isAdmin = myRole === 'owner' || myRole === 'admin';
                canSend = !(settings.chat_disabled && !isAdmin);
                isAnnouncementsOnly = settings.announcements_only && !isAdmin;

                if (!canSend || isAnnouncementsOnly) {
                    chatDisabled.classList.add('show');
                }

                // Load pinned messages
                await loadPinnedMessages();

                // Load messages
                loadMessages();

                // Listen to chat updates
                listenToChatUpdates();

                // Set online status
                setOnlineStatus();

            } catch (e) {
                console.error('Load chat error:', e);
                messagesEl.innerHTML = `<div style="text-align:center;color:red;padding:40px;">Error: ${e.message}</div>`;
            }
        }

        // ─── CHECK BLOCK STATUS ──────────────────────────────────────
        async function checkBlockStatus() {
            try {
                const participants = chatData.participants || [];
                const otherId = participants.find(id => id !== currentUserId);
                if (!otherId) return;

                const currentUserDoc = await db.collection('users').doc(currentUserId).get();
                const otherUserDoc = await db.collection('users').doc(otherId).get();

                const myBlocked = currentUserDoc.data()?.blocked_users || [];
                const theirBlocked = otherUserDoc.data()?.blocked_users || [];

                iBlockedThem = myBlocked.includes(otherId);
                theyBlockedMe = theirBlocked.includes(currentUserId);
                isBlocked = iBlockedThem || theyBlockedMe;

                if (isBlocked) {
                    blockedBanner.classList.add('show');
                    blockedText.textContent = iBlockedThem ? 'You blocked this user' : 'This user blocked you';
                }
            } catch (e) {
                console.error('Block check error:', e);
            }
        }

        // ─── LOAD PINNED MESSAGES ────────────────────────────────────
        async function loadPinnedMessages() {
            try {
                const snapshot = await db.collection('chats')
                    .doc(chatId)
                    .collection('pinned_messages')
                    .orderBy('pinned_at', 'desc')
                    .limit(3)
                    .get();

                pinnedMessages = snapshot.docs.map(doc => ({
                    id: doc.id,
                    message_id: doc.data().message_id,
                    ...doc.data()
                }));

                if (pinnedMessages.length > 0 && showPinned) {
                    const msgDoc = await db.collection('chats')
                        .doc(chatId)
                        .collection('messages')
                        .doc(pinnedMessages[0].message_id)
                        .get();

                    if (msgDoc.exists) {
                        const data = msgDoc.data();
                        pinnedText.textContent = data.text || data.content || 'Pinned message';
                        pinnedBanner.classList.add('show');
                    }
                }
            } catch (e) {
                console.error('Load pinned error:', e);
            }
        }

        // ─── LISTEN TO CHAT UPDATES ──────────────────────────────────
        function listenToChatUpdates() {
            db.collection('chats').doc(chatId).onSnapshot((doc) => {
                if (doc.exists) {
                    chatData = doc.data();
                    const settings = chatData.settings || {};
                    const myRole = chatData.participants_data?.[currentUserId]?.role || 'member';
                    const isAdmin = myRole === 'owner' || myRole === 'admin';
                    canSend = !(settings.chat_disabled && !isAdmin);
                    isAnnouncementsOnly = settings.announcements_only && !isAdmin;

                    if (!canSend || isAnnouncementsOnly) {
                        chatDisabled.classList.add('show');
                    } else {
                        chatDisabled.classList.remove('show');
                    }
                }
            });
        }

        // ─── LOAD MESSAGES ────────────────────────────────────────────
        function loadMessages() {
            db.collection('chats').doc(chatId).collection('messages')
                .where('deleted_for_everyone', '==', false)
                .orderBy('created_at', 'desc')
                .onSnapshot((snapshot) => {
                    if (snapshot.empty) {
                        messagesEl.innerHTML = `
                            <div style="text-align:center;color:rgba(255,255,255,0.2);padding:60px 0;">
                                <i class="fas fa-comment" style="font-size:48px;display:block;margin-bottom:16px;"></i>
                                No messages yet<br/>
                                <span style="font-size:13px;">Say hello!</span>
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    let lastDate = '';
                    const messages = [];

                    snapshot.docs.forEach((doc) => {
                        const msg = doc.data();
                        msg.id = doc.id;
                        const isMe = msg.sender_id === currentUserId;
                        const msgDate = msg.created_at ? new Date(msg.created_at.seconds * 1000) : new Date();
                        const dateStr = formatDate(msgDate);

                        // Skip deleted for me
                        const deletedFor = msg.deleted_for || [];
                        if (deletedFor.includes(currentUserId)) return;

                        messages.push({ ...msg, isMe, msgDate, dateStr });
                    });

                    // Reverse for chronological order
                    messages.reverse();

                    messages.forEach((msg) => {
                        if (msg.dateStr !== lastDate) {
                            html += `<div class="date-divider">${lastDate || msg.dateStr}</div>`;
                            lastDate = msg.dateStr;
                        }

                        const senderName = msg.sender_name || 'Unknown';
                        const senderAvatar = msg.sender_avatar || '';
                        const time = msg.msgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const content = msg.text || msg.content || '';
                        const mediaUrl = msg.media_url || '';
                        const mediaType = msg.media_type || '';
                        const isDeleted = msg.deleted_for_everyone || false;
                        const reactions = msg.reactions || {};
                        const replyContent = msg.reply_to_content || '';
                        const replySender = msg.reply_to_sender || '';

                        let bubbleContent = '';

                        if (isDeleted) {
                            bubbleContent = `<span class="deleted">This message was deleted</span>`;
                        } else {
                            if (msg.reply_to) {
                                bubbleContent += `
                                    <div class="reply-preview">
                                        <div class="reply-sender">${replySender}</div>
                                        <div class="reply-text">${replyContent}</div>
                                    </div>
                                `;
                            }

                            if (mediaType === 'image' && mediaUrl) {
                                bubbleContent += `<img src="${mediaUrl}" onclick="window.open('${mediaUrl}','_blank')" />`;
                            } else if (mediaType === 'audio' && mediaUrl) {
                                bubbleContent += `
                                    <div class="voice-note">
                                        <button class="play-btn" onclick="playAudio('${msg.id}', '${mediaUrl}')">
                                            <i class="fas fa-play"></i>
                                        </button>
                                        <span class="duration">${formatDuration(msg.duration || 0)}</span>
                                    </div>
                                `;
                            } else if (mediaType === 'video' && mediaUrl) {
                                bubbleContent += `
                                    <div style="background:#000;border-radius:12px;overflow:hidden;position:relative;width:200px;height:150px;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="window.open('${mediaUrl}','_blank')">
                                        <i class="fas fa-play-circle" style="font-size:40px;color:rgba(255,255,255,0.7);"></i>
                                    </div>
                                `;
                            } else if (mediaType === 'file' && mediaUrl) {
                                bubbleContent += `
                                    <div class="file">
                                        <i class="fas fa-file"></i>
                                        <div class="file-info">
                                            <div class="file-name">${msg.file_name || 'File'}</div>
                                            <div class="file-size">${msg.file_size || ''}</div>
                                        </div>
                                    </div>
                                `;
                            } else {
                                bubbleContent += formatText(content);
                            }
                        }

                        let senderHtml = '';
                        if (chatData.type === 'group' && !msg.isMe && !isDeleted) {
                            senderHtml = `<span class="sender">${senderName}</span>`;
                        }

                        let reactionsHtml = '';
                        if (Object.keys(reactions).length > 0) {
                            reactionsHtml = `<div class="reactions">`;
                            Object.keys(reactions).forEach(emoji => {
                                const count = reactions[emoji].length || 0;
                                reactionsHtml += `<span class="reaction">${emoji}${count > 1 ? count : ''}</span>`;
                            });
                            reactionsHtml += `</div>`;
                        }

                        html += `
                            <div class="msg ${msg.isMe ? 'me' : ''}">
                                ${!msg.isMe ? `<div class="avatar">${senderAvatar ? `<img src="${senderAvatar}" />` : senderName.charAt(0).toUpperCase()}</div>` : ''}
                                <div class="bubble">
                                    ${senderHtml}
                                    ${bubbleContent}
                                    <span class="time">${time}</span>
                                </div>
                            </div>
                            ${reactionsHtml}
                        `;
                    });

                    messagesEl.innerHTML = html;
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                });
        }

        // ─── SEND MESSAGE ─────────────────────────────────────────────
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !chatId || !currentUserId) return;

            if (isBlocked) {
                alert('You cannot send messages to this user');
                return;
            }

            if (!canSend || isAnnouncementsOnly) {
                alert('Only admins can send messages in this chat');
                return;
            }

            const msgData = {
                chat_id: chatId,
                sender_id: currentUserId,
                text: text,
                content: text,
                type: 'text',
                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                is_read: false,
                is_edited: false,
                deleted_for_everyone: false,
                deleted_for: [],
                reactions: {},
                reply_to: replyTo || null,
                reply_to_content: replyTo ? document.getElementById('replyText').textContent : null,
                reply_to_sender: replyTo ? document.getElementById('replySender').textContent : null
            };

            try {
                await db.collection('chats').doc(chatId).collection('messages').add(msgData);
                await db.collection('chats').doc(chatId).update({
                    last_message: text,
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp()
                });
                messageInput.value = '';
                onTextChanged(messageInput);
                clearReply();
            } catch (e) {
                console.error('Send error:', e);
                alert('Failed to send message: ' + e.message);
            }
        }

        // ─── UPLOAD MEDIA ─────────────────────────────────────────────
        async function uploadMedia(file, type) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('folder', `aurachat/chats/${chatId}`);

            try {
                const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${type === 'image' ? 'image' : type === 'video' ? 'video' : 'raw'}/upload`;
                const response = await fetch(url, { method: 'POST', body: formData });
                const data = await response.json();
                if (data.secure_url) return data.secure_url;
                throw new Error('Upload failed');
            } catch (e) {
                console.error('Upload error:', e);
                throw e;
            }
        }

        // ─── SEND MEDIA MESSAGE ──────────────────────────────────────
        async function sendMediaMessage(file, type) {
            if (!chatId || !currentUserId || !file) return;

            if (isBlocked) {
                alert('Cannot send media to blocked user');
                return;
            }

            const fileName = file.name || 'File';
            const fileSize = formatFileSize(file.size);

            try {
                actionBtn.disabled = true;
                actionBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                const mediaUrl = await uploadMedia(file, type);

                const msgData = {
                    chat_id: chatId,
                    sender_id: currentUserId,
                    type: type,
                    media_url: mediaUrl,
                    file_name: fileName,
                    file_size: fileSize,
                    content: type === 'image' ? '📷 Photo' : type === 'video' ? '🎥 Video' : type === 'audio' ? '🎤 Voice Message' : '📎 File',
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_read: false,
                    is_edited: false,
                    deleted_for_everyone: false,
                    deleted_for: [],
                    reactions: {},
                    reply_to: replyTo || null,
                    reply_to_content: replyTo ? document.getElementById('replyText').textContent : null,
                    reply_to_sender: replyTo ? document.getElementById('replySender').textContent : null
                };

                await db.collection('chats').doc(chatId).collection('messages').add(msgData);
                await db.collection('chats').doc(chatId).update({
                    last_message: msgData.content,
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                actionBtn.disabled = false;
                onTextChanged(messageInput);
                clearReply();

            } catch (e) {
                console.error('Send media error:', e);
                alert('Failed to upload file: ' + e.message);
                actionBtn.disabled = false;
                onTextChanged(messageInput);
            }
        }

        // ─── RECORDING ───────────────────────────────────────────────
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const file = new File([blob], `voice_${Date.now()}.webm`, { type: 'audio/webm' });
                    window.recordingFile = file;
                    window.recordingDuration = recordingSeconds;
                };

                mediaRecorder.start();
                isRecording = true;
                recordingSeconds = 0;

                actionBtn.classList.add('recording');
                actionBtn.innerHTML = '<i class="fas fa-stop"></i>';
                recordingIndicator.classList.add('show');

                recordingTimer = setInterval(() => {
                    recordingSeconds++;
                    const m = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
                    const s = (recordingSeconds % 60).toString().padStart(2, '0');
                    recordingTime.textContent = `${m}:${s}`;
                }, 1000);

            } catch (e) {
                console.error('Recording error:', e);
                alert('Microphone access denied.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                clearInterval(recordingTimer);
                actionBtn.classList.remove('recording');
                actionBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                recordingIndicator.classList.remove('show');
            }
        }

        function cancelRecording() {
            stopRecording();
            recordedChunks = [];
            window.recordingFile = null;
        }

        async function sendRecording() {
            if (!window.recordingFile) {
                alert('No recording to send');
                return;
            }

            const file = window.recordingFile;
            const duration = window.recordingDuration || 0;
            cancelRecording();

            try {
                const mediaUrl = await uploadMedia(file, 'audio');

                const msgData = {
                    chat_id: chatId,
                    sender_id: currentUserId,
                    type: 'audio',
                    media_url: mediaUrl,
                    duration: duration,
                    content: '🎤 Voice Message',
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    is_read: false,
                    is_edited: false,
                    deleted_for_everyone: false,
                    deleted_for: [],
                    reactions: {},
                    reply_to: replyTo || null,
                    reply_to_content: replyTo ? document.getElementById('replyText').textContent : null,
                    reply_to_sender: replyTo ? document.getElementById('replySender').textContent : null
                };

                await db.collection('chats').doc(chatId).collection('messages').add(msgData);
                await db.collection('chats').doc(chatId).update({
                    last_message: '🎤 Voice Message',
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                onTextChanged(messageInput);
                clearReply();

            } catch (e) {
                console.error('Send recording error:', e);
                alert('Failed to send voice message: ' + e.message);
            }
        }

        // ─── ATTACHMENT MENU ─────────────────────────────────────────
        function showAttachmentMenu() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.zip';

            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;

                let type = 'file';
                if (file.type.startsWith('image/')) type = 'image';
                else if (file.type.startsWith('video/')) type = 'video';
                else if (file.type.startsWith('audio/')) type = 'audio';

                sendMediaMessage(file, type);
            };

            input.click();
        }

        // ─── PLAY AUDIO ──────────────────────────────────────────────
        let currentAudio = null;

        function playAudio(messageId, audioUrl) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            currentAudio = new Audio(audioUrl);
            currentAudio.play();
        }

        // ─── UNPIN MESSAGE ────────────────────────────────────────────
        async function unpinMessage() {
            if (pinnedMessages.length === 0) return;
            try {
                await db.collection('chats').doc(chatId)
                    .collection('pinned_messages')
                    .doc(pinnedMessages[0].id)
                    .delete();
                pinnedBanner.classList.remove('show');
                showPinned = false;
            } catch (e) {
                console.error('Unpin error:', e);
            }
        }

        // ─── HELPERS ──────────────────────────────────────────────────
        function formatDate(date) {
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) return 'Today';
            if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
            return date.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function formatText(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, (url) => `<a href="${url}" target="_blank" style="color:#8B5CF6;text-decoration:underline;">${url}</a>`);
        }

        function setOnlineStatus() {
            if (!currentUserId) return;
            db.collection('users').doc(currentUserId).update({
                status: 'Online',
                last_seen: firebase.firestore.FieldValue.serverTimestamp(),
                is_online: true
            }).catch(() => {});
        }

            emojiPicker.classList.toggle('open');
        }

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (this.value.trim().length > 0) {
                    sendMessage();
                }
            }
        });

        // ─── OPEN MENU ────────────────────────────────────────────────
        function openMenu() {
            alert('Chat menu options coming soon');
        }

        // ─── SEARCH ────────────────────────────────────────────────────
        function searchMessages() {
            const query = prompt('Search messages:');
            if (query && query.trim()) {
                // Simple search highlight
                const msgs = document.querySelectorAll('.msg .bubble');
                msgs.forEach(el => {
                    const text = el.textContent.toLowerCase();
                    if (text.includes(query.toLowerCase())) {
                        el.style.background = 'rgba(139,92,246,0.2)';
                        setTimeout(() => {
                            el.style.background = '';
                        }, 3000);
                    }
                });
            }
        }

        console.log('💬 AURA Chat — Chat Screen (Full)');
    </script>

</body>
</html>
