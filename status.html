<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status - AURA Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 60px 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .header .title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .header-actions button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tabs {
            display: flex;
            padding: 0 20px 12px;
            gap: 8px;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: block;
        }

        .tab.active {
            color: #fff;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.25);
        }

        .tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }

        .tab i { margin-right: 6px; }

        .my-status {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .my-status .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid rgba(139, 92, 246, 0.5);
        }

        .my-status .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .my-status .avatar .placeholder {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.7);
        }

        .my-status .avatar .add-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #8B5CF6;
            border: 2px solid #0A0A0F;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
        }

        .my-status .info { flex: 1; }
        .my-status .info .name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .my-status .info .sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .section-title {
            padding: 12px 24px 8px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        .status-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 24px 80px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 0;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .status-item:hover { background: rgba(255, 255, 255, 0.02); }

        .status-item .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid rgba(6, 182, 212, 0.3);
        }

        .status-item .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-item .avatar .placeholder {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .status-item .info { flex: 1; }
        .status-item .info .name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .status-item .info .sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-item .info .sub i { font-size: 12px; color: rgba(255, 255, 255, 0.2); }

        .status-item .preview {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(139, 92, 246, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .status-item .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-item .preview .text-preview {
            font-size: 10px;
            color: #fff;
            padding: 4px;
            text-align: center;
            line-height: 1.2;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            text-align: center;
        }

        .empty-state i {
            font-size: 64px;
            color: rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.3);
        }

        .empty-state p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
        }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50vh;
        }

        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.1);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(139, 92, 246, 0.5);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #1a103c;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .modal-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .modal-item:hover { background: rgba(255, 255, 255, 0.05); }

        .modal-item .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .modal-item .icon.purple {
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
        }

        .modal-item .label {
            flex: 1;
            font-size: 15px;
            color: #fff;
        }

        @media (max-width: 640px) {
            .app { max-width: 100%; }
            .header { padding: 50px 16px 12px; }
            .my-status { padding: 12px 16px; }
            .status-list { padding: 8px 16px 70px; }
            .tabs { padding: 0 12px 8px; }
            .fab { bottom: 20px; right: 20px; width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="app">

        <!-- ─── HEADER ────────────────────────────────────────────── -->
        <div class="header">
            <div class="title">AURA</div>
            <div class="header-actions">
                <button onclick="window.location.href='/global_search.html'">
                    <i class="fas fa-search"></i>
                </button>
                <button onclick="openStatusMenu()">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>

        <!-- ─── TABS ────────────────────────────────────────────────── -->
        <div class="tabs">
            <a href="/chats.html" class="tab" data-tab="chats">
                <i class="fas fa-comment-dots"></i> Chats
            </a>
            <a href="/status.html" class="tab active" data-tab="status">
                <i class="fas fa-circle"></i> Status
            </a>
            <a href="/calls.html" class="tab" data-tab="calls">
                <i class="fas fa-phone"></i> Calls
            </a>
        </div>

        <!-- ─── MY STATUS ──────────────────────────────────────────── -->
        <div class="my-status" id="myStatus">
            <div class="avatar" id="myAvatar">
                <span class="placeholder"><i class="fas fa-user"></i></span>
                <div class="add-btn" onclick="event.stopPropagation();showAddStatusOptions()">
                    <i class="fas fa-plus"></i>
                </div>
            </div>
            <div class="info">
                <div class="name">My Status</div>
                <div class="sub" id="myStatusSub">Tap + to add status</div>
            </div>
        </div>

        <!-- ─── SECTION TITLE ──────────────────────────────────────── -->
        <div class="section-title">Recent Updates</div>

        <!-- ─── STATUS LIST ────────────────────────────────────────── -->
        <div class="status-list" id="statusList">
            <div class="loader">
                <div class="spinner"></div>
            </div>
        </div>

    </div>

    <!-- ─── FAB ────────────────────────────────────────────────────── -->
    <button class="fab" onclick="showAddStatusOptions()">
        <i class="fas fa-camera"></i>
    </button>

    <!-- ─── ADD STATUS MODAL ──────────────────────────────────────── -->
    <div class="modal-overlay" id="addStatusModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div style="text-align:center;font-size:18px;font-weight:600;color:#fff;margin-bottom:16px;">Add Status</div>
            <div class="modal-item" onclick="closeModal('addStatusModal');alert('Gallery')">
                <div class="icon purple"><i class="fas fa-photo"></i></div>
                <div class="label">Gallery</div>
            </div>
            <div class="modal-item" onclick="closeModal('addStatusModal');alert('Camera')">
                <div class="icon purple"><i class="fas fa-camera"></i></div>
                <div class="label">Camera</div>
            </div>
            <div class="modal-item" onclick="closeModal('addStatusModal');alert('Video')">
                <div class="icon purple"><i class="fas fa-video"></i></div>
                <div class="label">Video</div>
            </div>
            <div class="modal-item" onclick="closeModal('addStatusModal');alert('Text Status')">
                <div class="icon purple"><i class="fas fa-font"></i></div>
                <div class="label">Text Status</div>
            </div>
        </div>
    </div>

    <!-- ─── MENU MODAL ─────────────────────────────────────────────── -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-item" onclick="closeModal('menuModal');window.location.href='/settings.html'">
                <div class="icon purple"><i class="fas fa-cog"></i></div>
                <div class="label">Settings</div>
            </div>
            <div class="modal-item" onclick="closeModal('menuModal');window.location.href='/privacy_settings.html'">
                <div class="icon purple"><i class="fas fa-shield-alt"></i></div>
                <div class="label">Privacy</div>
            </div>
        </div>
    </div>

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ─── LOCAL STORAGE HELPERS ────────────────────────────────────
        function getLocal(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }

        // ─── DOM REFS ──────────────────────────────────────────────────
        const statusList = document.getElementById('statusList');
        const myStatusSub = document.getElementById('myStatusSub');
        const myAvatar = document.getElementById('myAvatar');

        // ─── STATE ─────────────────────────────────────────────────────
        let userId = '';

        // ─── GET USER ID ──────────────────────────────────────────────
        function getUserId() {
            const user = auth.currentUser;
            if (user) return user.uid;
            return getLocal('mock_user_id') || null;
        }

        // ─── ✅ FIXED: NO REDIRECTS! Just show content or message ────
        auth.onAuthStateChanged(function(user) {
            const id = getUserId();
            if (id) {
                userId = id;
                console.log('✅ User found:', userId);
                loadStatuses();
            } else {
                // ✅ NO REDIRECT - Just show message
                statusList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-slash"></i>
                        <h3>Not signed in</h3>
                        <p>Sign in to see and post status updates</p>
                        <button onclick="window.location.href='/email_verification.html'" style="margin-top:16px;padding:12px 32px;background:linear-gradient(135deg,#8B5CF6,#06B6D4);border:none;border-radius:12px;color:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;">Sign In</button>
                    </div>
                `;
                myStatusSub.textContent = 'Sign in to add status';
            }
        });

        // ─── LOAD STATUSES ────────────────────────────────────────────
        async function loadStatuses() {
            statusList.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;

            try {
                // 1. Load my status
                if (userId) {
                    const mySnapshot = await db.collection('statuses')
                        .where('user_id', '==', userId)
                        .where('expires_at', '>', new Date())
                        .orderBy('created_at', 'desc')
                        .get();

                    if (!mySnapshot.empty) {
                        const latest = mySnapshot.docs[0].data();
                        const timeAgo = getTimeAgo(latest.created_at.toDate());
                        const viewCount = latest.view_count || 0;
                        myStatusSub.textContent = `${timeAgo} • 👁 ${viewCount}`;
                        
                        if (latest.media_url) {
                            const img = document.createElement('img');
                            img.src = latest.media_url;
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'cover';
                            myAvatar.innerHTML = '';
                            myAvatar.appendChild(img);
                            const addBtn = document.createElement('div');
                            addBtn.className = 'add-btn';
                            addBtn.innerHTML = '<i class="fas fa-plus"></i>';
                            addBtn.onclick = (e) => { e.stopPropagation(); showAddStatusOptions(); };
                            myAvatar.appendChild(addBtn);
                        }
                    }
                }

                // 2. Load contacts statuses
                let contactIds = [];
                if (userId) {
                    const contactsSnapshot = await db.collection('users').doc(userId).collection('contacts').get();
                    contactIds = contactsSnapshot.docs.map(doc => doc.id);
                }

                if (contactIds.length === 0 && userId) {
                    statusList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <h3>No contacts yet</h3>
                            <p>Add contacts to see their status updates</p>
                        </div>
                    `;
                    return;
                }

                if (!userId) {
                    statusList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-user-slash"></i>
                            <h3>Sign in to see statuses</h3>
                            <p>Connect with friends and see their updates</p>
                        </div>
                    `;
                    return;
                }

                // Fetch statuses from contacts
                const statusSnapshot = await db.collection('statuses')
                    .where('user_id', 'in', contactIds.slice(0, 10))
                    .where('expires_at', '>', new Date())
                    .orderBy('created_at', 'desc')
                    .get();

                if (statusSnapshot.empty) {
                    statusList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-circle"></i>
                            <h3>No status updates</h3>
                            <p>Your contacts haven't posted any statuses yet</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const doc of statusSnapshot.docs) {
                    const data = doc.data();
                    const userDoc = await db.collection('users').doc(data.user_id).get();
                    const userData = userDoc.data() || {};
                    const username = userData.username || userData.display_name || 'Unknown';
                    const avatar = userData.avatar_url || null;
                    const mediaUrl = data.media_url;
                    const caption = data.caption || '';
                    const type = data.type || 'image';
                    const timeAgo = getTimeAgo(data.created_at.toDate());
                    const viewCount = data.view_count || 0;
                    const likes = data.likes || [];

                    let previewHTML = '';
                    if (type === 'text') {
                        previewHTML = `<div class="text-preview">${caption.length > 20 ? caption.substring(0,20)+'...' : caption}</div>`;
                    } else if (mediaUrl) {
                        previewHTML = `<img src="${mediaUrl}" />`;
                    } else {
                        previewHTML = `<i class="fas fa-image" style="color:rgba(255,255,255,0.3);"></i>`;
                    }

                    html += `
                        <div class="status-item" onclick="alert('View status from ${username}')">
                            <div class="avatar">
                                ${avatar ? `<img src="${avatar}" />` : `<span class="placeholder">${username.charAt(0).toUpperCase()}</span>`}
                            </div>
                            <div class="info">
                                <div class="name">${username}</div>
                                <div class="sub">
                                    ${timeAgo}
                                    <i class="fas fa-eye"></i> ${viewCount}
                                    <i class="fas fa-heart"></i> ${likes.length}
                                </div>
                            </div>
                            <div class="preview">${previewHTML}</div>
                        </div>
                    `;
                }

                statusList.innerHTML = html;

            } catch (e) {
                console.error('Load statuses error:', e);
                statusList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Error loading statuses</h3>
                        <p>${e.message}</p>
                        <button onclick="loadStatuses()" style="margin-top:16px;padding:12px 32px;background:linear-gradient(135deg,#8B5CF6,#06B6D4);border:none;border-radius:12px;color:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;">Try Again</button>
                    </div>
                `;
            }
        }

        // ─── HELPERS ──────────────────────────────────────────────────
        function getTimeAgo(date) {
            if (!date) return 'Just now';
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return minutes + 'm ago';
            if (hours < 24) return hours + 'h ago';
            return days + 'd ago';
        }

        function showAddStatusOptions() {
            if (!userId) {
                alert('Please sign in to add status');
                window.location.href = '/email_verification.html';
                return;
            }
            document.getElementById('addStatusModal').classList.add('show');
        }

        function openStatusMenu() {
            document.getElementById('menuModal').classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        // ─── CLOSE MODAL ON OVERLAY CLICK ────────────────────────────
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });

        // ─── CHECK LOCALSTORAGE ON LOAD ─────────────────────────────
        const mockId = getLocal('mock_user_id');
        if (mockId && !auth.currentUser) {
            userId = mockId;
