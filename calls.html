<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calls - AURA Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 60px 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .header .title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .header-actions button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tabs {
            display: flex;
            padding: 0 20px 12px;
            gap: 8px;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: block;
        }

        .tab.active {
            color: #fff;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.25);
        }

        .tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }

        .tab i { margin-right: 6px; }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 80px;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .user-item .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .user-item .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-item .avatar .online-dot {
            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #0A0A0F;
        }

        .user-item .avatar .online-dot.online { background: #10B981; }
        .user-item .avatar .online-dot.offline { background: #6B7280; }

        .user-item .info {
            flex: 1;
            min-width: 0;
        }

        .user-item .info .name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .user-item .info .status {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .user-item .info .status.online { color: #10B981; }

        .user-item .actions {
            display: flex;
            gap: 6px;
        }

        .user-item .actions button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-item .actions button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .user-item .actions button.video { color: #8B5CF6; }
        .user-item .actions button.video:hover { background: rgba(139, 92, 246, 0.2); }
        .user-item .actions button.call { color: #10B981; }
        .user-item .actions button.call:hover { background: rgba(16, 185, 129, 0.2); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
            padding: 20px;
        }

        .empty-state i {
            font-size: 64px;
            color: rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
        }

        .empty-state p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
        }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }

        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.1);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(139, 92, 246, 0.5);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #1a103c;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            margin-bottom: 16px;
        }

        .modal-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .modal-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .modal-item .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .modal-item .icon.purple { background: rgba(139, 92, 246, 0.2); color: #8B5CF6; }
        .modal-item .icon.green { background: rgba(16, 185, 129, 0.2); color: #10B981; }
        .modal-item .icon.orange { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        .modal-item .label {
            flex: 1;
            font-size: 15px;
            color: #fff;
        }

        .modal-item .arrow {
            color: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 640px) {
            .app { max-width: 100%; }
            .header { padding: 50px 16px 12px; }
            .user-item { padding: 10px 12px; }
            .user-item .avatar { width: 48px; height: 48px; }
            .tabs { padding: 0 12px 8px; }
            .fab { bottom: 20px; right: 20px; width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="app">

        <!-- ─── HEADER ────────────────────────────────────────────── -->
        <div class="header">
            <div class="title">AURA</div>
            <div class="header-actions">
                <button onclick="window.location.href='/global_search.html'">
                    <i class="fas fa-search"></i>
                </button>
                <button onclick="openMenu()">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>

        <!-- ─── TABS ────────────────────────────────────────────────── -->
        <div class="tabs">
            <a href="/chats.html" class="tab" data-tab="chats">
                <i class="fas fa-comment-dots"></i> Chats
            </a>
            <a href="/status.html" class="tab" data-tab="status">
                <i class="fas fa-circle"></i> Status
            </a>
            <a href="/calls.html" class="tab active" data-tab="calls">
                <i class="fas fa-phone"></i> Calls
            </a>
        </div>

        <!-- ─── USER LIST ──────────────────────────────────────────── -->
        <div class="user-list" id="userList">
            <div class="loader">
                <div class="spinner"></div>
            </div>
        </div>

    </div>

    <!-- ─── FAB ────────────────────────────────────────────────────── -->
    <button class="fab" onclick="showCallOptions()">
        <i class="fas fa-phone"></i>
    </button>

    <!-- ─── CALL OPTIONS MODAL ────────────────────────────────────── -->
    <div class="modal-overlay" id="callOptionsModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-title">Call Options</div>
            <div class="modal-item" onclick="closeModal('callOptionsModal');showCallCode()">
                <div class="icon purple"><i class="fas fa-hashtag"></i></div>
                <div class="label">Join by Code</div>
                <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </div>
            <div class="modal-item" onclick="closeModal('callOptionsModal');startGroupCall(false)">
                <div class="icon green"><i class="fas fa-phone"></i></div>
                <div class="label">Start Voice Call</div>
                <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </div>
            <div class="modal-item" onclick="closeModal('callOptionsModal');startGroupCall(true)">
                <div class="icon purple"><i class="fas fa-video"></i></div>
                <div class="label">Start Video Call</div>
                <span class="arrow"><i class="fas fa-chevron-right"></i></span>
            </div>
        </div>
    </div>

    <!-- ─── MENU MODAL ─────────────────────────────────────────────── -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-item" onclick="closeModal('menuModal');window.location.href='/settings.html'">
                <div class="icon purple"><i class="fas fa-cog"></i></div>
                <div class="label">Settings</div>
            </div>
            <div class="modal-item" onclick="closeModal('menuModal');window.location.href='/profile.html'">
                <div class="icon purple"><i class="fas fa-user"></i></div>
                <div class="label">Profile</div>
            </div>
        </div>
    </div>

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ─── LOCAL STORAGE HELPERS ────────────────────────────────────
        function getLocal(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }

        // ─── DOM REFS ──────────────────────────────────────────────────
        const userList = document.getElementById('userList');

        // ─── STATE ─────────────────────────────────────────────────────
        let userId = '';

        // ─── GET USER ID ──────────────────────────────────────────────
        function getUserId() {
            const user = auth.currentUser;
            if (user) return user.uid;
            return getLocal('mock_user_id') || null;
        }

        // ─── ✅ FIXED: NO REDIRECTS! ─────────────────────────────────
        auth.onAuthStateChanged(function(user) {
            const id = getUserId();
            if (id) {
                userId = id;
                console.log('✅ User found:', userId);
                loadUsers();
            } else {
                // ✅ NO REDIRECT - Just show message
                userList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-slash"></i>
                        <h3>Not signed in</h3>
                        <p>Sign in to make calls</p>
                        <button onclick="window.location.href='/email_verification.html'" style="margin-top:16px;padding:12px 32px;background:linear-gradient(135deg,#8B5CF6,#06B6D4);border:none;border-radius:12px;color:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;">Sign In</button>
                    </div>
                `;
            }
        });

        // ─── LOAD USERS ───────────────────────────────────────────────
        async function loadUsers() {
            if (!userId) {
                userList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-slash"></i>
                        <h3>Not signed in</h3>
                        <p>Sign in to make calls</p>
                        <button onclick="window.location.href='/email_verification.html'" style="margin-top:16px;padding:12px 32px;background:linear-gradient(135deg,#8B5CF6,#06B6D4);border:none;border-radius:12px;color:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;">Sign In</button>
                    </div>
                `;
                return;
            }

            userList.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;

            try {
                // Get all chats
                const chatsSnapshot = await db.collection('chats')
                    .where('participants', 'array-contains', userId)
                    .get();

                const chatUserIds = new Set();
                for (const chat of chatsSnapshot.docs) {
                    const participants = chat.data().participants || [];
                    participants.forEach(pid => {
                        if (pid !== userId) chatUserIds.add(pid);
                    });
                }

                if (chatUserIds.size === 0) {
                    userList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <h3>No contacts yet</h3>
                            <p>Start a chat first to call someone</p>
                            <button class="btn" onclick="window.location.href='/global_search.html'">Find People</button>
                        </div>
                    `;
                    return;
                }

                // Fetch user profiles
                const ids = Array.from(chatUserIds);
                const usersData = [];
                for (let i = 0; i < ids.length; i += 10) {
                    const batch = ids.slice(i, i + 10);
                    const snapshot = await db.collection('users')
                        .where(FieldPath.documentId, 'in', batch)
                        .get();

                    snapshot.docs.forEach(doc => {
                        const data = doc.data();
                        usersData.push({
                            id: doc.id,
                            username: data.username || data.display_name || 'Unknown',
                            avatar_url: data.avatar_url || null,
                            status: data.status || 'offline',
                            bio: data.bio || ''
                        });
                    });
                }

                renderUsers(usersData);

            } catch (e) {
                console.error('Load users error:', e);
                userList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Error loading users</h3>
                        <p>${e.message}</p>
                        <button class="btn" onclick="loadUsers()">Try Again</button>
                    </div>
                `;
            }
        }

        // ─── RENDER USERS ─────────────────────────────────────────────
        function renderUsers(users) {
            if (users.length === 0) {
                userList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <h3>No contacts yet</h3>
                        <p>Start a chat first to call someone</p>
                        <button class="btn" onclick="window.location.href='/global_search.html'">Find People</button>
                    </div>
                `;
                return;
            }

            userList.innerHTML = users.map(user => {
                const isOnline = user.status === 'online';
                const name = user.username || 'Unknown';
                const initial = name.charAt(0).toUpperCase();

                return `
                    <div class="user-item" onclick="alert('View profile: ${name}')">
                        <div class="avatar">
                            ${user.avatar_url ? `<img src="${user.avatar_url}" />` : initial}
                            <div class="online-dot ${isOnline ? 'online' : 'offline'}"></div>
                        </div>
                        <div class="info">
                            <div class="name">${name}</div>
                            <div class="status ${isOnline ? 'online' : ''}">${isOnline ? 'Online' : 'Offline'}</div>
                        </div>
                        <div class="actions">
                            <button class="video" onclick="event.stopPropagation();alert('📹 Video call to ${name}')">
                                <i class="fas fa-video"></i>
                            </button>
                            <button class="call" onclick="event.stopPropagation();alert('📞 Voice call to ${name}')">
                                <i class="fas fa-phone"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ─── HELPERS ──────────────────────────────────────────────────
        function showCallOptions() {
            if (!userId) {
                alert('Please sign in first');
                window.location.href = '/email_verification.html';
                return;
            }
            document.getElementById('callOptionsModal').classList.add('show');
        }

        function showCallCode() {
            if (!userId) {
                alert('Please sign in first');
                return;
            }
            const code = prompt('Enter call code:');
            if (code && code.trim()) {
                alert(`Joining call: ${code.trim()} (Demo)`);
            }
        }

        function startGroupCall(isVideo) {
            if (!userId) {
                alert('Please sign in first');
                return;
            }
            const code = 'GRP_' + Math.random().toString(36).substring(2, 8).toUpperCase();
            alert(`${isVideo ? 'Video' : 'Voice'} group call started!\nCode: ${code}`);
        }

        function openMenu() {
            document.getElementById('menuModal').classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        // ─── CLOSE MODAL ON OVERLAY CLICK ────────────────────────────
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });

        // ─── CHECK LOCALSTORAGE ON LOAD ─────────────────────────────
        const mockId = getLocal('mock_user_id');
        if (mockId && !auth.currentUser) {
            userId = mockId;
            console.log('✅ User from localStorage:', userId);
            loadUsers();
        }

        console.log('📞 AURA Chat — Calls Screen (With Firebase, No Redirects)');
    </script>

</body>
</html>
