<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=/splash.html" />
    <title>AURA Chat</title>
    <style>
        body {
            background: #0A0A0F;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: #8B5CF6;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading AURA Chat...</p>
    </div>
    <script>
        setTimeout(() => {
            window.location.href = '/splash.html';
        }, 1000);
    </script>
</body>
</html>
