<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Status - AURA Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
        }

        /* ─── HEADER ────────────────────────────────────────────── */
        .header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .header .close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }

        .header .title {
            flex: 1;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .share-btn {
            background: none;
            border: none;
            color: #06B6D4;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease;
        }

        .header .share-btn:hover {
            background: rgba(6, 182, 212, 0.1);
        }

        .header .share-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .header .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── EXPIRY BADGE ────────────────────────────────────────── */
        .expiry-badge {
            margin: 0 16px 16px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .expiry-badge i {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .expiry-badge span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* ─── CONTENT ────────────────────────────────────────────── */
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .content .text-input {
            width: 100%;
            min-height: 200px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 32px;
            font-family: 'Inter', sans-serif;
            text-align: center;
            outline: none;
            resize: none;
            padding: 20px;
        }

        .content .text-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .content .image-preview {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .content .image-preview img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 16px;
        }

        .content .image-preview .caption-overlay {
            position: absolute;
            bottom: 60px;
            left: 20px;
            right: 20px;
        }

        .content .image-preview .caption-overlay textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-family: 'Inter', sans-serif;
            text-align: center;
            outline: none;
            resize: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .content .image-preview .caption-overlay textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* ─── BOTTOM ACTIONS ──────────────────────────────────────── */
        .bottom-actions {
            padding: 20px 16px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px 24px 0 0;
            display: flex;
            justify-content: space-around;
            flex-shrink: 0;
            gap: 20px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            transition: transform 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn .icon-wrap {
            padding: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
        }

        .action-btn .icon-wrap i {
            font-size: 28px;
            color: #fff;
        }

        .action-btn .icon-wrap.danger {
            background: rgba(239, 68, 68, 0.2);
        }

        .action-btn .icon-wrap.danger i {
            color: #ef4444;
        }

        .action-btn .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .action-btn .label.danger {
            color: #ef4444;
        }

        /* ─── LOADER ────────────────────────────────────────────── */
        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }

        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.1);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 640px) {
            .app { max-width: 100%; }
            .content .text-input { font-size: 24px; }
            .header .title { font-size: 20px; }
            .bottom-actions { padding: 16px 12px 24px; }
            .action-btn .icon-wrap { width: 48px; height: 48px; padding: 12px; }
            .action-btn .icon-wrap i { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="app" id="app">

        <!-- ─── HEADER ────────────────────────────────────────────── -->
        <div class="header">
            <button class="close" onclick="window.history.back()">
                <i class="fas fa-times"></i>
            </button>
            <div class="title">Create Status</div>
            <button class="share-btn" id="shareBtn" onclick="createStatus()">Share</button>
        </div>

        <!-- ─── EXPIRY BADGE ────────────────────────────────────────── -->
        <div class="expiry-badge">
            <i class="fas fa-clock"></i>
            <span>Auto-deletes after 24 hours</span>
        </div>

        <!-- ─── CONTENT ────────────────────────────────────────────── -->
        <div class="content" id="contentArea">
            <!-- Text Input -->
            <textarea 
                id="textInput" 
                class="text-input" 
                placeholder="Type a status..." 
                autofocus
            ></textarea>

            <!-- Image Preview (hidden by default) -->
            <div class="image-preview" id="imagePreview" style="display:none;">
                <img id="previewImage" src="" alt="Status image" />
                <div class="caption-overlay">
                    <textarea 
                        id="captionInput" 
                        placeholder="Add a caption..." 
                        rows="2"
                    ></textarea>
                </div>
            </div>
        </div>

        <!-- ─── BOTTOM ACTIONS ──────────────────────────────────────── -->
        <div class="bottom-actions">
            <button class="action-btn" onclick="pickImage()">
                <div class="icon-wrap"><i class="fas fa-images"></i></div>
                <span class="label">Gallery</span>
            </button>
            <button class="action-btn" onclick="takePhoto()">
                <div class="icon-wrap"><i class="fas fa-camera"></i></div>
                <span class="label">Camera</span>
            </button>
            <button class="action-btn" id="removeBtn" style="display:none;" onclick="removeImage()">
                <div class="icon-wrap danger"><i class="fas fa-trash"></i></div>
                <span class="label danger">Remove</span>
            </button>
        </div>

    </div>

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ─── CLOUDINARY CONFIG ──────────────────────────────────────
        const CLOUDINARY_CLOUD_NAME = 'dn2mwp1lc';
        const CLOUDINARY_UPLOAD_PRESET = 'aura_chat';

        // ─── DOM REFS ──────────────────────────────────────────────────
        const textInput = document.getElementById('textInput');
        const captionInput = document.getElementById('captionInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewImage = document.getElementById('previewImage');
        const shareBtn = document.getElementById('shareBtn');
        const removeBtn = document.getElementById('removeBtn');
        const contentArea = document.getElementById('contentArea');

        // ─── STATE ─────────────────────────────────────────────────────
        let userId = '';
        let selectedImage = null; // File object
        let imageDataUrl = null;
        let isLoading = false;

        // ─── LOCAL STORAGE HELPERS ────────────────────────────────────
        function getLocal(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }

        // ─── AUTH ──────────────────────────────────────────────────────
        function getUserId() {
            const user = auth.currentUser;
            if (user) return user.uid;
            return getLocal('mock_user_id') || null;
        }

        auth.onAuthStateChanged(function(user) {
            const id = getUserId();
            if (id) {
                userId = id;
                console.log('✅ User found:', userId);
            } else {
                alert('Please sign in to create a status');
                window.location.href = '/onboarding.html';
            }
        });

        // ─── PICK IMAGE ──────────────────────────────────────────────
        function pickImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    selectedImage = file;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        imageDataUrl = ev.target.result;
                        showImagePreview(imageDataUrl);
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        // ─── TAKE PHOTO ──────────────────────────────────────────────
        function takePhoto() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    selectedImage = file;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        imageDataUrl = ev.target.result;
                        showImagePreview(imageDataUrl);
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        // ─── SHOW IMAGE PREVIEW ──────────────────────────────────────
        function showImagePreview(dataUrl) {
            previewImage.src = dataUrl;
            imagePreview.style.display = 'flex';
            textInput.style.display = 'none';
            removeBtn.style.display = 'flex';
            
            // Move caption from text input if exists
            if (textInput.value.trim()) {
                captionInput.value = textInput.value;
            }
        }

        // ─── REMOVE IMAGE ────────────────────────────────────────────
        function removeImage() {
            selectedImage = null;
            imageDataUrl = null;
            imagePreview.style.display = 'none';
            textInput.style.display = 'block';
            removeBtn.style.display = 'none';
            captionInput.value = '';
            
            // Focus back on text input
            setTimeout(() => textInput.focus(), 100);
        }

        // ─── CREATE STATUS ───────────────────────────────────────────
        async function createStatus() {
            const text = textInput.value.trim();
            const caption = captionInput.value.trim();
            const finalText = text || caption;

            if (!finalText && !selectedImage) {
                alert('Please add text or an image');
                return;
            }

            if (!userId) {
                alert('Please sign in first');
                return;
            }

            isLoading = true;
            shareBtn.disabled = true;
            shareBtn.innerHTML = '<span class="spinner"></span>';

            try {
                let mediaUrl = null;
                let type = 'text';

                // Upload image via Cloudinary if selected
                if (selectedImage) {
                    type = 'image';
                    const formData = new FormData();
                    formData.append('file', selectedImage);
                    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                    formData.append('folder', `aurachat/statuses/${userId}`);

                    const response = await fetch(
                        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                        { method: 'POST', body: formData }
                    );
                    const data = await response.json();

                    if (data.secure_url) {
                        mediaUrl = data.secure_url;
                    } else {
                        throw new Error('Upload failed');
                    }
                }

                const now = new Date();
                const expiresAt = new Date(now.getTime() + 24 * 60 * 60 * 1000);

                await db.collection('statuses').add({
                    user_id: userId,
                    caption: finalText || null,
                    media_url: mediaUrl,
                    type: type,
                    created_at: now,
                    expires_at: expiresAt,
                    view_count: 0,
                    likes: []
                });

                alert('✅ Status added! Expires in 24h');
                window.location.href = '/status.html';

            } catch (e) {
                console.error('Create status error:', e);
                alert('❌ Error: ' + e.message);
                shareBtn.disabled = false;
                shareBtn.textContent = 'Share';
                isLoading = false;
            }
        }

        // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                createStatus();
            }
            if (e.key === 'Escape') {
                window.history.back();
            }
        });

        // ─── AUTO-RESIZE TEXTAREA ────────────────────────────────────
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        textInput.addEventListener('input', function() {
            autoResize(this);
        });

        captionInput.addEventListener('input', function() {
            autoResize(this);
        });

        console.log('📸 AURA Chat — Create Status');
    </script>

</body>
</html>
