<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Chats</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0F;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }

        /* ===== APP CONTAINER ===== */
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== SLIVER APP BAR ===== */
        .sliver-app-bar {
            background: #0A0A0F;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            padding-bottom: 4px;
        }

        .app-bar-top {
            padding: 20px 16px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-bar-actions {
            display: flex;
            gap: 4px;
        }

        .app-bar-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-bar-actions button:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== TAB BAR ===== */
        .tab-bar {
            display: flex;
            padding: 0 8px 8px 8px;
            gap: 4px;
            position: relative;
        }

        .tab-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: transparent;
            border: none;
            text-decoration: none;
            display: block;
        }

        .tab-item.active {
            color: #fff;
            font-weight: 600;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        /* ===== TAB CONTENT ===== */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0 80px 0;
            scroll-behavior: smooth;
        }

        /* ===== LOADING ===== */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            padding: 20px;
        }

        .empty-icon {
            font-size: 80px;
            color: rgba(255,255,255,0.1);
            margin-bottom: 16px;
        }

        .empty-title {
            color: rgba(255,255,255,0.3);
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-subtitle {
            color: rgba(255,255,255,0.2);
            font-size: 13px;
        }

        /* ===== CHAT LIST ===== */
        .chat-list {
            list-style: none;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 8px;
            margin: 0 4px;
            text-decoration: none;
            color: inherit;
        }

        .chat-item:hover {
            background: rgba(255,255,255,0.03);
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-avatar .avatar-icon {
            color: #8B5CF6;
            font-size: 18px;
        }

        .chat-info {
            flex: 1;
            margin-left: 14px;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .chat-time {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
            margin-left: 8px;
        }

        .chat-subtitle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .chat-last-message {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .chat-unread {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 8px;
            min-width: 20px;
            text-align: center;
        }

        /* ===== FLOATING ACTION BUTTON ===== */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            max-width: 480px;
            width: calc(100% - 60px);
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
        }

        .fab {
            pointer-events: auto;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .fab:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #1a103c;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            padding: 20px;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0 auto 20px auto;
        }

        .modal-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
            text-decoration: none;
            color: inherit;
        }

        .modal-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .modal-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 18px;
        }

        .modal-item-label {
            color: #fff;
            font-size: 15px;
        }

        .modal-item.danger .modal-item-label {
            color: #ef4444;
        }

        .modal-item.danger .modal-item-icon {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* ===== DIALOG ===== */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog-content {
            background: #1a103c;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 380px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .dialog-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .dialog-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            margin-bottom: 16px;
        }

        .dialog-input:focus {
            border-color: #8B5CF6;
        }

        .dialog-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .dialog-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .dialog-btn:hover {
            opacity: 0.8;
        }

        .dialog-btn-cancel {
            background: transparent;
            color: rgba(255,255,255,0.5);
        }

        .dialog-btn-confirm {
            background: #8B5CF6;
            color: #fff;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a103c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .fab-container {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <script>
        // ============================================================
        // FIREBASE CONFIG (Replace with your own)
        // ============================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // CHAT PROVIDER - Full Dart to JS Conversion
        // ============================================================
        class ChatProvider {
            constructor() {
                this._auth = auth;
                this._firestore = db;
                
                this._chats = [];
                this._contacts = [];
                this._blockedUsers = [];
                this._isLoading = false;
                this._error = null;
                this._chatsSubscription = null;
                this._currentUserId = null;
                this._listeners = [];

                this._init();
            }

            // ===== GETTERS =====
            get chats() { return this._chats; }
            get contacts() { return this._contacts; }
            get blockedUsers() { return this._blockedUsers; }
            get isLoading() { return this._isLoading; }
            get error() { return this._error; }
            get currentUserId() { return this._currentUserId; }

            // ===== LISTENER SYSTEM =====
            addListener(callback) {
                this._listeners.push(callback);
            }

            removeListener(callback) {
                this._listeners = this._listeners.filter(cb => cb !== callback);
            }

            _notifyListeners() {
                this._listeners.forEach(callback => {
                    try { callback(); } catch (e) { console.error('Listener error:', e); }
                });
            }

            // ===== INIT =====
            async _init() {
                this._currentUserId = this._auth.currentUser?.uid;
                if (this._currentUserId) {
                    await this._loadBlockedUsers();
                    await this.loadChats();
                    this._subscribeToChats();
                }
            }

            async setMockUser(mockUserId) {
                this._currentUserId = mockUserId;
                await this._loadBlockedUsers();
                await this.loadChats();
                this._subscribeToChats();
                this._notifyListeners();
            }

            // ===== BLOCKED USERS =====
            async _loadBlockedUsers() {
                try {
                    const doc = await this._firestore
                        .collection('users')
                        .doc(this._currentUserId)
                        .get();
                    
                    if (doc.exists) {
                        const data = doc.data();
                        this._blockedUsers = data.blocked_users || [];
                    }
                } catch (e) {
                    console.error('Load blocked users error:', e);
                }
            }

            isBlocked(userId) {
                return this._blockedUsers.includes(userId);
            }

            async blockUser(userId) {
                if (!this._currentUserId) return;
                try {
                    await this._firestore
                        .collection('users')
                        .doc(this._currentUserId)
                        .set({
                            blocked_users: firebase.firestore.FieldValue.arrayUnion([userId])
                        }, { merge: true });
                    
                    this._blockedUsers.push(userId);
                    this._notifyListeners();
                    showToast('User blocked');
                } catch (e) {
                    this._error = `Failed to block user: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to block user');
                }
            }

            async unblockUser(userId) {
                if (!this._currentUserId) return;
                try {
                    await this._firestore
                        .collection('users')
                        .doc(this._currentUserId)
                        .set({
                            blocked_users: firebase.firestore.FieldValue.arrayRemove([userId])
                        }, { merge: true });
                    
                    this._blockedUsers = this._blockedUsers.filter(id => id !== userId);
                    this._notifyListeners();
                    showToast('User unblocked');
                } catch (e) {
                    this._error = `Failed to unblock user: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to unblock user');
                }
            }

            // ===== LOAD CHATS =====
            async loadChats() {
                this._setLoading(true);
                this._error = null;

                try {
                    const userId = this._currentUserId;
                    if (!userId) {
                        this._setLoading(false);
                        return;
                    }

                    const snapshot = await this._firestore
                        .collection('chats')
                        .where('participants', 'array-contains', userId)
                        .orderBy('last_message_at', 'desc')
                        .get();

                    const formattedChats = [];

                    for (const doc of snapshot.docs) {
                        const chat = doc.data();
                        const chatId = doc.id;
                        const chatType = chat.type || 'direct';

                        // Skip deleted chats
                        const deletedFor = chat.deleted_for || [];
                        if (deletedFor.includes(userId)) continue;

                        // Get participants list
                        const participants = chat.participants || [];

                        // Skip blocked DMs
                        if (chatType === 'direct') {
                            const otherUserId = participants.find(id => id !== userId) || '';
                            if (otherUserId && this._blockedUsers.includes(otherUserId)) {
                                continue;
                            }
                        }

                        // Skip archived
                        const participantsData = chat.participants_data || {};
                        const myData = participantsData[userId] || {};
                        if (myData.is_archived === true) continue;

                        // Get unread count
                        const unreadCount = await this._getUnreadCount(chatId, userId);

                        // Get member count
                        let participantsCount = 0;
                        if (chatType === 'group' || chatType === 'channel') {
                            participantsCount = participants.length;
                        }

                        // Get role
                        const role = myData.role || 'member';

                        // Fix last_message_at
                        let lastMessageAt = null;
                        const rawLastMessageAt = chat.last_message_at;
                        if (rawLastMessageAt?.toDate) {
                            lastMessageAt = rawLastMessageAt.toDate();
                        } else if (rawLastMessageAt instanceof Date) {
                            lastMessageAt = rawLastMessageAt;
                        } else if (typeof rawLastMessageAt === 'string') {
                            lastMessageAt = new Date(rawLastMessageAt);
                        }

                        // Fallback
                        if (!lastMessageAt || lastMessageAt > new Date(Date.now() + 60000)) {
                            const createdAt = chat.created_at;
                            if (createdAt?.toDate) {
                                lastMessageAt = createdAt.toDate();
                            } else if (createdAt instanceof Date) {
                                lastMessageAt = createdAt;
                            } else if (typeof createdAt === 'string') {
                                lastMessageAt = new Date(createdAt);
                            } else {
                                lastMessageAt = new Date();
                            }
                        }

                        formattedChats.push({
                            ...chat,
                            id: chatId,
                            role: role,
                            unread_count: unreadCount,
                            participants_count: participantsCount,
                            last_message_at: lastMessageAt,
                        });
                    }

                    this._chats = formattedChats;
                    this._setLoading(false);
                } catch (e) {
                    this._error = `Failed to load chats: ${e.message}`;
                    console.error('loadChats error:', e);
                    this._setLoading(false);
                }
            }

            async _getUnreadCount(chatId, userId) {
                try {
                    const snapshot = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .collection('messages')
                        .where('is_read', '==', false)
                        .where('sender_id', '!=', userId)
                        .get();
                    
                    return snapshot.size;
                } catch (e) {
                    return 0;
                }
            }

            _subscribeToChats() {
                const userId = this._currentUserId;
                if (!userId) return;

                if (this._chatsSubscription) {
                    this._chatsSubscription();
                    this._chatsSubscription = null;
                }

                this._chatsSubscription = this._firestore
                    .collection('chats')
                    .where('participants', 'array-contains', userId)
                    .onSnapshot(() => {
                        setTimeout(() => this.loadChats(), 500);
                    }, (error) => {
                        console.error('Chat subscription error:', error);
                    });
            }

            // ===== LOAD CONTACTS =====
            async loadContacts() {
                this._setLoading(true);

                try {
                    const userId = this._currentUserId;
                    if (!userId) {
                        this._setLoading(false);
                        return;
                    }

                    const snapshot = await this._firestore
                        .collection('users')
                        .get();

                    this._contacts = snapshot.docs
                        .map(doc => doc.data())
                        .filter(user => user.id !== userId);
                    
                    this._setLoading(false);
                } catch (e) {
                    this._error = `Failed to load contacts: ${e.message}`;
                    this._setLoading(false);
                }
            }

            // ===== START DIRECT CHAT =====
            async startDirectChat(otherUserId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return null;

                    if (this._blockedUsers.includes(otherUserId)) {
                        this._error = 'You have blocked this user';
                        this._notifyListeners();
                        showToast('You have blocked this user');
                        return null;
                    }

                    // Check if direct chat already exists
                    const existingQuery = await this._firestore
                        .collection('chats')
                        .where('type', '==', 'direct')
                        .where('participants', 'array-contains', userId)
                        .get();

                    for (const doc of existingQuery.docs) {
                        const participants = doc.data().participants || [];
                        if (participants.includes(otherUserId)) {
                            await this.loadChats();
                            return this._chats.find(chat => chat.id === doc.id) || { id: doc.id, ...doc.data() };
                        }
                    }

                    // Fetch other user's profile
                    const otherUserDoc = await this._firestore
                        .collection('users')
                        .doc(otherUserId)
                        .get();
                    
                    const otherUserData = otherUserDoc.data();
                    const otherUserName = otherUserData?.username || otherUserData?.display_name || 'Unknown';
                    const otherUserAvatar = otherUserData?.avatar_url || null;

                    const chatId = this._generateUUID();

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .set({
                            id: chatId,
                            type: 'direct',
                            participants: [userId, otherUserId],
                            participants_data: {
                                [userId]: { role: 'member', joined_at: firebase.firestore.FieldValue.serverTimestamp() },
                                [otherUserId]: { role: 'member', joined_at: firebase.firestore.FieldValue.serverTimestamp() },
                            },
                            name: otherUserName,
                            avatar_url: otherUserAvatar,
                            created_at: firebase.firestore.FieldValue.serverTimestamp(),
                            last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
                            last_message: 'Chat started',
                        });

                    await this.loadChats();
                    showToast('Chat started!');
                    return this._chats.find(chat => chat.id === chatId) || { id: chatId };
                } catch (e) {
                    this._error = `Failed to start chat: ${e.message}`;
                    showToast('Failed to start chat');
                    return null;
                }
            }

            // ===== MARK MESSAGES AS READ =====
            async markMessagesAsRead(chatId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    const unreadSnapshot = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .collection('messages')
                        .where('is_read', '==', false)
                        .where('sender_id', '!=', userId)
                        .get();

                    const batch = this._firestore.batch();
                    unreadSnapshot.docs.forEach(doc => {
                        batch.update(doc.ref, { is_read: true });
                    });
                    await batch.commit();

                    const index = this._chats.findIndex(chat => chat.id === chatId);
                    if (index >= 0) {
                        this._chats[index].unread_count = 0;
                        this._notifyListeners();
                    }
                } catch (e) {
                    console.error('Mark as read error:', e);
                }
            }

            // ===== DELETE CHAT =====
            async deleteChat(chatId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .update({
                            deleted_for: firebase.firestore.FieldValue.arrayUnion([userId])
                        });

                    this._chats = this._chats.filter(chat => chat.id !== chatId);
                    this._notifyListeners();
                    showToast('Chat deleted');
                } catch (e) {
                    this._error = `Failed to delete chat: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to delete chat');
                }
            }

            // ===== PERMANENTLY DELETE CHAT =====
            async permanentlyDeleteChat(chatId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) {
                        this._error = 'Not authenticated';
                        this._notifyListeners();
                        return false;
                    }

                    const chatDoc = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .get();
                    
                    if (!chatDoc.exists) {
                        this._error = 'Chat not found';
                        this._notifyListeners();
                        return false;
                    }

                    const chatData = chatDoc.data();
                    const myRole = chatData?.participants_data?.[userId]?.role || 'member';

                    if (myRole !== 'owner') {
                        this._error = 'Only the owner can delete this group';
                        this._notifyListeners();
                        showToast('Only the owner can delete this group');
                        return false;
                    }

                    const messagesSnapshot = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .collection('messages')
                        .get();

                    const batch = this._firestore.batch();
                    messagesSnapshot.docs.forEach(doc => {
                        batch.delete(doc.ref);
                    });
                    await batch.commit();

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .delete();

                    this._chats = this._chats.filter(chat => chat.id !== chatId);
                    this._notifyListeners();
                    showToast('Group permanently deleted');
                    return true;
                } catch (e) {
                    this._error = `Failed to delete group: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to delete group');
                    return false;
                }
            }

            // ===== ARCHIVE / UNARCHIVE =====
            async archiveChat(chatId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .update({
                            [`participants_data.${userId}.is_archived`]: true
                        });

                    await this.loadChats();
                    showToast('Chat archived');
                } catch (e) {
                    this._error = `Failed to archive chat: ${e.message}`;
                    showToast('Failed to archive chat');
                }
            }

            async unarchiveChat(chatId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .update({
                            [`participants_data.${userId}.is_archived`]: false
                        });

                    await this.loadChats();
                    showToast('Chat unarchived');
                } catch (e) {
                    this._error = `Failed to unarchive chat: ${e.message}`;
                    showToast('Failed to unarchive chat');
                }
            }

            // ===== LEAVE CHAT =====
            async leaveChat(chatId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    const chatDoc = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .get();
                    
                    if (!chatDoc.exists) return;

                    const chatData = chatDoc.data();
                    const isOwner = chatData.created_by === userId;

                    if (isOwner) {
                        this._error = 'Owner cannot leave. Transfer ownership or delete the group.';
                        this._notifyListeners();
                        showToast('Owner cannot leave');
                        return;
                    }

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .update({
                            participants: firebase.firestore.FieldValue.arrayRemove([userId]),
                            [`participants_data.${userId}`]: firebase.firestore.FieldValue.delete(),
                            member_count: firebase.firestore.FieldValue.increment(-1)
                        });

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .collection('messages')
                        .add({
                            type: 'system',
                            content: 'A member left',
                            created_at: firebase.firestore.FieldValue.serverTimestamp()
                        });

                    await this.loadChats();
                    showToast('Left the group');
                } catch (e) {
                    this._error = `Failed to leave chat: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to leave group');
                }
            }

            // ===== KICK MEMBER =====
            async kickMember(chatId, memberId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    const chatDoc = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .get();
                    
                    if (!chatDoc.exists) return;

                    const chatData = chatDoc.data();
                    const myRole = chatData?.participants_data?.[userId]?.role || 'member';

                    if (myRole !== 'owner' && myRole !== 'admin') {
                        this._error = 'Only owners and admins can kick members';
                        this._notifyListeners();
                        showToast('Only owners and admins can kick members');
                        return;
                    }

                    const memberRole = chatData?.participants_data?.[memberId]?.role || 'member';
                    if (memberRole === 'owner') {
                        this._error = 'Cannot kick the owner';
                        this._notifyListeners();
                        showToast('Cannot kick the owner');
                        return;
                    }
                    if (myRole === 'admin' && memberRole === 'admin') {
                        this._error = 'Admins cannot kick other admins';
                        this._notifyListeners();
                        showToast('Admins cannot kick other admins');
                        return;
                    }

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .update({
                            participants: firebase.firestore.FieldValue.arrayRemove([memberId]),
                            [`participants_data.${memberId}`]: firebase.firestore.FieldValue.delete(),
                            member_count: firebase.firestore.FieldValue.increment(-1)
                        });

                    const userDoc = await this._firestore
                        .collection('users')
                        .doc(memberId)
                        .get();
                    const userName = userDoc.data()?.username || 'A member';

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .collection('messages')
                        .add({
                            type: 'system',
                            content: `${userName} was removed`,
                            created_at: firebase.firestore.FieldValue.serverTimestamp()
                        });

                    await this.loadChats();
                    showToast('Member kicked');
                } catch (e) {
                    this._error = `Failed to kick member: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to kick member');
                }
            }

            // ===== BAN MEMBER =====
            async banMember(chatId, memberId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    const chatDoc = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .get();
                    
                    if (!chatDoc.exists) return;

                    const chatData = chatDoc.data();
                    const myRole = chatData?.participants_data?.[userId]?.role || 'member';

                    if (myRole !== 'owner' && myRole !== 'admin') {
                        this._error = 'Only owners and admins can ban members';
                        this._notifyListeners();
                        showToast('Only owners and admins can ban members');
                        return;
                    }

                    const memberRole = chatData?.participants_data?.[memberId]?.role || 'member';
                    if (memberRole === 'owner') {
                        this._error = 'Cannot ban the owner';
                        this._notifyListeners();
                        showToast('Cannot ban the owner');
                        return;
                    }

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .update({
                            participants: firebase.firestore.FieldValue.arrayRemove([memberId]),
                            [`participants_data.${memberId}`]: firebase.firestore.FieldValue.delete(),
                            banned_users: firebase.firestore.FieldValue.arrayUnion([memberId]),
                            member_count: firebase.firestore.FieldValue.increment(-1)
                        });

                    const userDoc = await this._firestore
                        .collection('users')
                        .doc(memberId)
                        .get();
                    const userName = userDoc.data()?.username || 'A member';

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .collection('messages')
                        .add({
                            type: 'system',
                            content: `${userName} was banned`,
                            created_at: firebase.firestore.FieldValue.serverTimestamp()
                        });

                    await this.loadChats();
                    showToast('Member banned');
                } catch (e) {
                    this._error = `Failed to ban member: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to ban member');
                }
            }

            // ===== PROMOTE TO ADMIN =====
            async promoteToAdmin(chatId, memberId) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    const chatDoc = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .get();
                    
                    if (!chatDoc.exists) return;

                    const chatData = chatDoc.data();
                    const myRole = chatData?.participants_data?.[userId]?.role || 'member';

                    if (myRole !== 'owner') {
                        this._error = 'Only the owner can promote members';
                        this._notifyListeners();
                        showToast('Only the owner can promote members');
                        return;
                    }

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .update({
                            [`participants_data.${memberId}.role`]: 'admin'
                        });

                    const userDoc = await this._firestore
                        .collection('users')
                        .doc(memberId)
                        .get();
                    const userName = userDoc.data()?.username || 'A member';

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .collection('messages')
                        .add({
                            type: 'system',
                            content: `${userName} was promoted to admin`,
                            created_at: firebase.firestore.FieldValue.serverTimestamp()
                        });

                    await this.loadChats();
                    showToast('Member promoted to admin');
                } catch (e) {
                    this._error = `Failed to promote member: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to promote member');
                }
            }

            // ===== TOGGLE SETTING =====
            async toggleSetting(chatId, settingKey, value) {
                try {
                    const userId = this._currentUserId;
                    if (!userId) return;

                    const chatDoc = await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .get();
                    
                    if (!chatDoc.exists) return;

                    const chatData = chatDoc.data();
                    const myRole = chatData?.participants_data?.[userId]?.role || 'member';

                    if (myRole !== 'owner' && myRole !== 'admin') {
                        this._error = 'Only owners and admins can change settings';
                        this._notifyListeners();
                        showToast('Only owners and admins can change settings');
                        return;
                    }

                    await this._firestore
                        .collection('chats')
                        .doc(chatId)
                        .update({
                            [`settings.${settingKey}`]: value
                        });

                    await this.loadChats();
                    showToast('Setting updated');
                } catch (e) {
                    this._error = `Failed to update setting: ${e.message}`;
                    this._notifyListeners();
                    showToast('Failed to update setting');
                }
            }

            // ===== HELPERS =====
            _setLoading(value) {
                this._isLoading = value;
                this._notifyListeners();
            }

            clearError() {
                this._error = null;
                this._notifyListeners();
            }

            _generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            // ===== DISPOSE =====
            dispose() {
                if (this._chatsSubscription) {
                    this._chatsSubscription();
                    this._chatsSubscription = null;
                }
                this._listeners = [];
            }
        }

        // ============================================================
        // UI CONTROLLER
        // ============================================================
        let chatProvider = null;
        const chatsContainer = document.getElementById('chatsContainer');

        // ===== TOAST =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== RENDER CHATS =====
        function renderChats() {
            if (!chatProvider) return;

            if (chatProvider.isLoading) {
                chatsContainer.innerHTML = `
                    <div class="loading-container">
                        <div class="spinner"></div>
                    </div>
                `;
                return;
            }

            if (chatProvider.chats.length === 0) {
                chatsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-comment-dots"></i></div>
                        <div class="empty-title">No chats yet</div>
                        <div class="empty-subtitle">Tap + to start a conversation</div>
                    </div>
                `;
                return;
            }

            let html = '<ul class="chat-list">';
            chatProvider.chats.forEach(chat => {
                const name = chat.name || 'Unknown';
                const avatar = chat.avatar_url || null;
                const lastMessage = chat.last_message || '';
                const time = chat.last_message_at || null;
                const unread = chat.unread_count || 0;
                const chatType = chat.type || 'direct';
                const isGroup = chatType === 'group';
                const isChannel = chatType === 'channel';

                let avatarHtml = '';
                if (avatar) {
                    avatarHtml = `<img src="${avatar}" alt="${name}" />`;
                } else {
                    let icon = 'fa-user';
                    if (isChannel) icon = 'fa-bullhorn';
                    else if (isGroup) icon = 'fa-users';
                    avatarHtml = `<i class="fas ${icon} avatar-icon"></i>`;
                }

                const timeStr = time ? formatTime(time) : '';

                let unreadHtml = '';
                if (unread > 0) {
                    unreadHtml = `<span class="chat-unread">${unread}</span>`;
                }

                const chatId = chat.id;
                const href = isChannel 
                    ? `channel.html?id=${chatId}&name=${encodeURIComponent(name)}`
                    : `chat.html?id=${chatId}&name=${encodeURIComponent(name)}&avatar=${encodeURIComponent(avatar || '')}&group=${isGroup}`;

                html += `
                    <a href="${href}" class="chat-item" onclick="chatProvider.markMessagesAsRead('${chatId}')">
                        <div class="chat-avatar">${avatarHtml}</div>
                        <div class="chat-info">
                            <div class="chat-header">
                                <span class="chat-name">${escapeHtml(name)}</span>
                                <span class="chat-time">${timeStr}</span>
                            </div>
                            <div class="chat-subtitle">
                                <span class="chat-last-message">${escapeHtml(lastMessage)}</span>
                                ${unreadHtml}
                            </div>
                        </div>
                    </a>
                `;
            });
            html += '</ul>';
            chatsContainer.innerHTML = html;
        }

        // ===== FORMAT TIME =====
        function formatTime(time) {
            if (!time) return '';

            let date;
            if (time.toDate) {
                date = time.toDate();
            } else if (time instanceof Date) {
                date = time;
            } else if (typeof time === 'string') {
                date = new Date(time);
            } else {
                return '';
            }

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            if (msgDate.getTime() === today.getTime()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (msgDate.getTime() === yesterday.getTime()) {
                return 'Yesterday';
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== FAB HANDLER =====
        function handleFabClick() {
            openModal('newChatModal');
        }

        // ===== MODAL HELPERS =====
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ===== MENU =====
        function showMenu() {
            openModal('menuModal');
        }

        // ===== SIGN OUT =====
        async function signOut() {
            try {
                await auth.signOut();
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Sign out error:', error);
                showToast('Error signing out');
            }
        }

        // ===== INIT APP =====
        function initApp() {
            chatProvider = new ChatProvider();

            chatProvider.addListener(() => {
                renderChats();
            });

            renderChats();
        }

        // ============================================================
        // START APP
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Check auth state
            auth.onAuthStateChanged(user => {
                if (user) {
                    initApp();
                } else {
                    // Use mock user for demo
                    chatProvider = new ChatProvider();
                    chatProvider.setMockUser('mock_user_123');
                    chatProvider.addListener(() => {
                        renderChats();
                    });
                    renderChats();
                }
            });
        });

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(el => {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }
        });

        console.log('🚀 AURA Chat loaded with ChatProvider!');
    </script>
