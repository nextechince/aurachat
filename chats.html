<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AURA - Chats</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0F;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }

        /* ===== APP CONTAINER ===== */
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0A0A0F;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== SLIVER APP BAR ===== */
        .sliver-app-bar {
            background: #0A0A0F;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            padding-bottom: 4px;
        }

        .app-bar-top {
            padding: 20px 16px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-bar-actions {
            display: flex;
            gap: 4px;
        }

        .app-bar-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-bar-actions button:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== TAB BAR ===== */
        .tab-bar {
            display: flex;
            padding: 0 8px 8px 8px;
            gap: 4px;
            position: relative;
        }

        .tab-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: transparent;
            border: none;
            text-decoration: none;
            display: block;
        }

        .tab-item.active {
            color: #fff;
            font-weight: 600;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        /* ===== TAB CONTENT ===== */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0 80px 0;
            scroll-behavior: smooth;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOADING ===== */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            padding: 20px;
        }

        .empty-icon {
            font-size: 80px;
            color: rgba(255,255,255,0.1);
            margin-bottom: 16px;
        }

        .empty-title {
            color: rgba(255,255,255,0.3);
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-subtitle {
            color: rgba(255,255,255,0.2);
            font-size: 13px;
        }

        /* ===== CHAT LIST ===== */
        .chat-list {
            list-style: none;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 8px;
            margin: 0 4px;
            text-decoration: none;
            color: inherit;
        }

        .chat-item:hover {
            background: rgba(255,255,255,0.03);
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #1a103c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-avatar .avatar-icon {
            color: #8B5CF6;
            font-size: 18px;
        }

        .chat-info {
            flex: 1;
            margin-left: 14px;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .chat-time {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
            margin-left: 8px;
        }

        .chat-subtitle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .chat-last-message {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .chat-unread {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 8px;
            min-width: 20px;
            text-align: center;
        }

        /* ===== FLOATING ACTION BUTTON ===== */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            max-width: 480px;
            width: calc(100% - 60px);
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
        }

        .fab {
            pointer-events: auto;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .fab:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #1a103c;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            padding: 20px;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0 auto 20px auto;
        }

        .modal-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
            text-decoration: none;
            color: inherit;
        }

        .modal-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .modal-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 18px;
        }

        .modal-item-label {
            color: #fff;
            font-size: 15px;
        }

        .modal-item.danger .modal-item-label {
            color: #ef4444;
        }

        .modal-item.danger .modal-item-icon {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* ===== DIALOG ===== */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog-content {
            background: #1a103c;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 380px;
            animation: fadeIn 0.3s ease;
        }

        .dialog-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .dialog-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            margin-bottom: 16px;
        }

        .dialog-input:focus {
            border-color: #8B5CF6;
        }

        .dialog-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .dialog-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .dialog-btn:hover {
            opacity: 0.8;
        }

        .dialog-btn-cancel {
            background: transparent;
            color: rgba(255,255,255,0.5);
        }

        .dialog-btn-confirm {
            background: #8B5CF6;
            color: #fff;
        }

        /* ===== CHANNEL CODE BOX ===== */
        .code-box {
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            margin: 12px 0;
        }

        .code-box-label {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
        }

        .code-box-code {
            color: #8B5CF6;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 8px;
            word-break: break-all;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .fab-container {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- App Bar -->
        <div class="sliver-app-bar">
            <div class="app-bar-top">
                <div class="app-title">AURA</div>
                <div class="app-bar-actions">
                    <a href="global_search.html" class="app-bar-actions" style="text-decoration:none;">
                        <button><i class="fas fa-search"></i></button>
                    </a>
                    <button onclick="showMenu()"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tab-bar">
                <a href="chats.html" class="tab-item active" data-tab="0">
                    Chats
                </a>
                <a href="status.html" class="tab-item" data-tab="1">
                    Status
                </a>
                <a href="calls.html" class="tab-item" data-tab="2">
                    Calls
                </a>
            </div>
        </div>

        <!-- Tab Content -->
        <div class="tab-content" id="tabContent">
            <!-- Chats Tab -->
            <div class="tab-panel active" id="panel0">
                <div id="chatsContainer">
                    <div class="loading-container">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Status Tab -->
            <div class="tab-panel" id="panel1">
                <div id="statusContainer">
                    <div class="loading-container">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Calls Tab -->
            <div class="tab-panel" id="panel2">
                <div class="calls-container">
                    <div class="calls-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div class="calls-text">Tap + to start a call</div>
                </div>
            </div>
        </div>

        <!-- FAB -->
        <div class="fab-container">
            <a href="#" class="fab" id="fabBtn" onclick="handleFabClick(event)">
                <i class="fas fa-comment"></i>
            </a>
        </div>
    </div>

    <!-- ===== MODALS ===== -->

    <!-- New Chat Options Modal -->
    <div class="modal-overlay" id="newChatModal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <a href="global_search.html" class="modal-item" onclick="closeModal('newChatModal')">
                <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div class="modal-item-label">New Chat</div>
            </a>
            <a href="create_group.html" class="modal-item" onclick="closeModal('newChatModal')">
                <div class="modal-item-icon" style="background: rgba(6,182,212,0.2); color: #06B6D4;">
                    <i class="fas fa-users"></i>
                </div>
                <div class="modal-item-label">New Group</div>
            </a>
            <a href="create_channel.html" class="modal-item" onclick="closeModal('newChatModal')">
                <div class="modal-item-icon" style="background: rgba(251,191,36,0.2); color: #FBBF24;">
                    <i class="fas fa-bullhorn"></i>
                </div>
                <div class="modal-item-label">New Channel</div>
            </a>
        </div>
    </div>

    <!-- Status Options Modal -->
    <div class="modal-overlay" id="statusModal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <a href="#" class="modal-item" onclick="closeModal('statusModal'); alert('Camera feature coming soon!')">
                <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                    <i class="fas fa-camera"></i>
                </div>
                <div class="modal-item-label">Camera</div>
            </a>
            <a href="#" class="modal-item" onclick="closeModal('statusModal'); alert('Gallery feature coming soon!')">
                <div class="modal-item-icon" style="background: rgba(6,182,212,0.2); color: #06B6D4;">
                    <i class="fas fa-images"></i>
                </div>
                <div class="modal-item-label">Gallery</div>
            </a>
            <a href="#" class="modal-item" onclick="closeModal('statusModal'); alert('Text Status feature coming soon!')">
                <div class="modal-item-icon" style="background: rgba(251,191,36,0.2); color: #FBBF24;">
                    <i class="fas fa-font"></i>
                </div>
                <div class="modal-item-label">Text Status</div>
            </a>
        </div>
    </div>

    <!-- Call Options Modal -->
    <div class="modal-overlay" id="callModal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            
            <div class="code-box">
                <div class="code-box-label">Share this code to join</div>
                <div class="code-box-code" id="channelCode">Loading...</div>
            </div>

            <a href="call_pick.html" class="modal-item" onclick="closeModal('callModal')">
                <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                    <i class="fas fa-user-search"></i>
                </div>
                <div class="modal-item-label">Call from Contacts</div>
            </a>
            <a href="call_active.html" class="modal-item" onclick="closeModal('callModal')">
                <div class="modal-item-icon" style="background: rgba(6,182,212,0.2); color: #06B6D4;">
                    <i class="fas fa-phone"></i>
                </div>
                <div class="modal-item-label">Start Voice Call</div>
            </a>
            <a href="call_active.html" class="modal-item" onclick="closeModal('callModal')">
                <div class="modal-item-icon" style="background: rgba(251,191,36,0.2); color: #FBBF24;">
                    <i class="fas fa-video"></i>
                </div>
                <div class="modal-item-label">Start Video Call</div>
            </a>
            <a href="#" class="modal-item" onclick="closeModal('callModal'); showJoinDialog()">
                <div class="modal-item-icon" style="background: rgba(236,72,153,0.2); color: #EC4899;">
                    <i class="fas fa-dial"></i>
                </div>
                <div class="modal-item-label">Join by Code</div>
            </a>
        </div>
    </div>

    <!-- Menu Modal -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <a href="settings.html" class="modal-item" onclick="closeModal('menuModal')">
                <div class="modal-item-icon" style="background: rgba(139,92,246,0.2); color: #8B5CF6;">
                    <i class="fas fa-cog"></i>
                </div>
                <div class="modal-item-label">Settings</div>
            </a>
            <a href="profile.html" class="modal-item" onclick="closeModal('menuModal')">
                <div class="modal-item-icon" style="background: rgba(6,182,212,0.2); color: #06B6D4;">
                    <i class="fas fa-user"></i>
                </div>
                <div class="modal-item-label">Profile</div>
            </a>
            <div class="modal-item danger" onclick="closeModal('menuModal'); signOut()">
                <div class="modal-item-icon">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
                <div class="modal-item-label">Sign Out</div>
            </div>
        </div>
    </div>

    <!-- Join Call Dialog -->
    <div class="dialog-overlay" id="joinDialog">
        <div class="dialog-content">
            <div class="dialog-title">Join Call</div>
            <input type="text" class="dialog-input" id="joinCodeInput" placeholder="Enter channel name..." />
            <div class="dialog-actions">
                <button class="dialog-btn dialog-btn-cancel" onclick="closeDialog('joinDialog')">Cancel</button>
                <button class="dialog-btn dialog-btn-confirm" onclick="joinCall()">Join</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG (Replace with your own)
        // ============================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // STATE
        // ============================================================
        let currentTab = 0;
        let chats = [];
        let isLoading = true;
        let currentUser = null;
        let mockUserId = null;

        // ============================================================
        // DOM REFS
        // ============================================================
        const chatsContainer = document.getElementById('chatsContainer');
        const statusContainer = document.getElementById('statusContainer');
        const fabBtn = document.getElementById('fabBtn');
        const fabIcon = fabBtn.querySelector('i');

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Check which page we're on based on URL
            const path = window.location.pathname;
            if (path.includes('status.html')) {
                switchTab(1);
            } else if (path.includes('calls.html')) {
                switchTab(2);
            } else {
                switchTab(0);
            }
            
            initAuth();
            setupTabHighlighting();
        });

        function setupTabHighlighting() {
            const path = window.location.pathname;
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.classList.remove('active');
                if (path.includes('status.html') && tab.textContent.trim() === 'Status') {
                    tab.classList.add('active');
                } else if (path.includes('calls.html') && tab.textContent.trim() === 'Calls') {
                    tab.classList.add('active');
                } else if ((path.includes('chats.html') || path === '/' || path === '/index.html') && tab.textContent.trim() === 'Chats') {
                    tab.classList.add('active');
                }
            });
        }

        function initAuth() {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    loadChats();
                    loadStatuses();
                } else {
                    // For demo, use mock user
                    mockUserId = 'mock_user_123';
                    loadChats();
                    loadStatuses();
                }
            });
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(index) {
            currentTab = index;
            
            // Update panels
            document.querySelectorAll('.tab-panel').forEach((panel, i) => {
                panel.classList.toggle('active', i === index);
            });

            // Update FAB
            updateFab(index);
        }

        function updateFab(index) {
            const icons = ['fa-comment', 'fa-camera', 'fa-phone-plus'];
            const labels = ['New Chat', 'Add Status', 'New Call'];
            fabIcon.className = `fas ${icons[index]}`;
            fabBtn.title = labels[index];
        }

        // ============================================================
        // LOAD CHATS (Firebase)
        // ============================================================
        function loadChats() {
            isLoading = true;
            showLoading(chatsContainer);

            const userId = currentUser ? currentUser.uid : mockUserId;
            if (!userId) {
                showEmptyChats();
                return;
            }

            db.collection('users')
                .doc(userId)
                .collection('chats')
                .orderBy('last_message_at', 'desc')
                .onSnapshot((snapshot) => {
                    isLoading = false;
                    chats = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data.id = doc.id;
                        chats.push(data);
                    });
                    renderChats();
                }, (error) => {
                    isLoading = false;
                    console.error('Error loading chats:', error);
                    showEmptyChats();
                });
        }

        function renderChats() {
            if (isLoading) {
                showLoading(chatsContainer);
                return;
            }

            if (chats.length === 0) {
                showEmptyChats();
                return;
            }

            let html = '<ul class="chat-list">';
            chats.forEach(chat => {
                html += buildChatItem(chat);
            });
            html += '</ul>';
            chatsContainer.innerHTML = html;
        }

        function buildChatItem(chat) {
            const name = chat.name || 'Unknown';
            const avatar = chat.avatar_url || null;
            const lastMessage = chat.last_message || '';
            const time = chat.last_message_at || null;
            const unread = chat.unread_count || 0;
            const chatType = chat.type || 'direct';
            const isGroup = chatType === 'group';
            const isChannel = chatType === 'channel';

            let avatarHtml = '';
            if (avatar) {
                avatarHtml = `<img src="${avatar}" alt="${name}" />`;
            } else {
                let icon = 'fa-user';
                if (isChannel) icon = 'fa-bullhorn';
                else if (isGroup) icon = 'fa-users';
                avatarHtml = `<i class="fas ${icon} avatar-icon"></i>`;
            }

            const timeStr = time ? formatTime(time) : '';

            let unreadHtml = '';
            if (unread > 0) {
                unreadHtml = `<span class="chat-unread">${unread}</span>`;
            }

            const chatId = chat.id;
            const href = isChannel 
                ? `channel.html?id=${chatId}&name=${encodeURIComponent(name)}`
                : `chat.html?id=${chatId}&name=${encodeURIComponent(name)}&avatar=${encodeURIComponent(avatar || '')}&group=${isGroup}`;

            return `
                <a href="${href}" class="chat-item">
                    <div class="chat-avatar">${avatarHtml}</div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <span class="chat-name">${escapeHtml(name)}</span>
                            <span class="chat-time">${timeStr}</span>
                        </div>
                        <div class="chat-subtitle">
                            <span class="chat-last-message">${escapeHtml(lastMessage)}</span>
                            ${unreadHtml}
                        </div>
                    </div>
                </a>
            `;
        }

        function showLoading(container) {
            container.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                </div>
            `;
        }

        function showEmptyChats() {
            chatsContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-comment-dots"></i></div>
                    <div class="empty-title">No chats yet</div>
                    <div class="empty-subtitle">Start a conversation</div>
                </div>
            `;
        }

        // ============================================================
        // LOAD STATUSES (Firebase) - for status.html page
        // ============================================================
        function loadStatuses() {
            const userId = currentUser ? currentUser.uid : mockUserId;
            if (!userId) {
                statusContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-camera"></i></div>
                        <div class="empty-title">No status updates</div>
                    </div>
                `;
                return;
            }

            db.collection('users')
                .doc(userId)
                .collection('statuses')
                .orderBy('created_at', 'desc')
                .limit(20)
                .onSnapshot((snapshot) => {
                    if (snapshot.empty) {
                        statusContainer.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon"><i class="fas fa-camera"></i></div>
                                <div class="empty-title">No status updates</div>
                                <div class="empty-subtitle">Tap + to add a status</div>
                            </div>
                        `;
                        return;
                    }

                    let html = '<div class="status-list">';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const name = data.userName || 'Unknown';
                        const avatar = data.userAvatar || null;
                        const time = data.created_at ? formatTime(data.created_at) : '';

                        html += `
                            <a href="status_view.html?id=${doc.id}" class="status-item" style="text-decoration:none;color:inherit;display:flex;align-items:center;padding:12px;background:rgba(255,255,255,0.03);border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.05);">
                                <div class="status-avatar" style="width:50px;height:50px;border-radius:50%;border:2px solid #8B5CF6;padding:2px;margin-right:14px;">
                                    ${avatar ? `<img src="${avatar}" alt="${name}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />` : `<div style="width:100%;height:100%;border-radius:50%;background:#1a103c;display:flex;align-items:center;justify-content:center;color:#8B5CF6;font-size:20px;"><i class="fas fa-user"></i></div>`}
                                </div>
                                <div class="status-info" style="flex:1;">
                                    <div class="status-name" style="font-weight:600;font-size:14px;">${escapeHtml(name)}</div>
                                    <div class="status-time" style="font-size:12px;color:rgba(255,255,255,0.3);">${time}</div>
                                </div>
                            </a>
                        `;
                    });
                    html += '</div>';
                    statusContainer.innerHTML = html;
                }, (error) => {
                    console.error('Error loading statuses:', error);
                });
        }

        // ============================================================
        // FAB HANDLER
        // ============================================================
        function handleFabClick(e) {
            e.preventDefault();
            const path = window.location.pathname;
            
            if (path.includes('status.html')) {
                openModal('statusModal');
            } else if (path.includes('calls.html')) {
                openModal('callModal');
                generateChannelCode();
            } else {
                openModal('newChatModal');
            }
        }

        // ============================================================
        // MODAL HELPERS
        // ============================================================
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeDialog(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal on overlay click
        document.querySelectorAll('.modal-overlay, .dialog-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ============================================================
        // MENU
        // ============================================================
        function showMenu() {
            openModal('menuModal');
        }

        // ============================================================
        // CALL FUNCTIONS
        // ============================================================
        function generateChannelCode() {
            const code = 'aura_' + Math.random().toString(36).substring(2, 10);
            document.getElementById('channelCode').textContent = code;
            return code;
        }

        function showJoinDialog() {
            closeModal('callModal');
            document.getElementById('joinDialog').classList.add('active');
            document.getElementById('joinCodeInput').value = '';
            setTimeout(() => document.getElementById('joinCodeInput').focus(), 100);
        }

        function joinCall() {
            const code = document.getElementById('joinCodeInput').value.trim();
            if (code) {
                closeDialog('joinDialog');
                window.location.href = `call_active.html?channel=${encodeURIComponent(code)}`;
            }
        }

        // ============================================================
        // AUTH - SIGN OUT
        // ============================================================
        async function signOut() {
            try {
                await auth.signOut();
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Sign out error:', error);
                alert('Error signing out. Please try again.');
            }
        }

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function formatTime(time) {
            if (!time) return '';

            let date;
            if (time.toDate) {
                date = time.toDate();
            } else if (time instanceof Date) {
                date = time;
            } else if (typeof time === 'string') {
                date = new Date(time);
            } else {
                return '';
            }

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

            if (msgDate.getTime() === today.getTime()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (msgDate.getTime() === yesterday.getTime()) {
                return 'Yesterday';
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active, .dialog-overlay.active').forEach(el => {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }
        });

        console.log('🚀 AURA Chat loaded successfully!');
        console.log('📱 Connected to Firebase');
    </script>

</body>
