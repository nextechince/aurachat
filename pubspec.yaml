name: aurachat
description: AURA Chat App
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_database: ^10.3.0
  firebase_storage: ^11.2.5
  firebase_messaging: ^14.6.5
  cloudinary_public: ^0.23.1

  # State Management
  provider: ^6.1.2
  google_generative_ai: ^0.4.6

  # UI & System
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  intl: ^0.18.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  share_plus: ^7.2.2
  uni_links: ^0.5.1
  crypto: ^3.0.3

  # Auth & Security
  local_auth: ^2.1.8

  # Phone & Input
  intl_phone_field: ^3.2.0

  # http request
  http: ^1.2.2

  # Chat & Media
  uuid: ^4.5.0
  emoji_picker_flutter: ^2.0.0  # ✅ DOWNGRADED from 3.0.0 to 2.0.0
  file_picker: ^6.1.1
  path_provider: ^2.1.0
  open_filex: ^4.3.4
  just_audio: ^0.9.36
  record: ^5.0.0
  video_player: ^2.8.1
  dio: ^5.4.0
  path: ^1.8.3
  url_launcher: ^6.2.1

  # Calls
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.0.1

  # Storage & Preferences
  shared_preferences: ^2.2.2  # ✅ DOWNGRADED

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Connectivity
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/emojis/
    - assets/audio/
    - assets/audio/ringtone_ambition.mp3
    - assets/audio/ringtone_phonk.mp3
    - assets/audio/ringtone_fadded.mp3
    - assets/audio/ringtone_pop.mp3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
