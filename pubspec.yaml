name: aurachat
description: AURA Chat App
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_database: ^11.1.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0
  cloudinary_public: ^0.23.1

  # State Management
  provider: ^6.1.2
  google_generative_ai: ^0.4.6

  # UI & System
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  # FIX: Use intl version 0.18.1 to be compatible with local_auth_ios
  intl: ^0.18.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  share_plus: ^10.1.0
  uni_links: ^0.5.1
  crypto: ^3.0.3

  # Auth & Security
  local_auth: ^2.3.0
  # FIX: Remove local_auth_ios and local_auth_android - local_auth handles both
  # local_auth_android: ^1.0.7
  # local_auth_ios: ^1.1.3

  # Phone & Input
  intl_phone_field: ^3.2.0

  # http request
  http: ^1.2.2

  # Chat & Media
  uuid: ^4.5.0
  emoji_picker_flutter: ^3.1.0
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  just_audio: ^0.9.39
  record: ^5.1.2
  video_player: ^2.9.3
  dio: ^5.7.0
  path: ^1.9.0
  url_launcher: ^6.3.1

  # Calls
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.1

  # Storage & Preferences
  shared_preferences: ^2.3.5

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Connectivity
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/emojis/
    - assets/audio/
    - assets/audio/ringtone_ambition.mp3
    - assets/audio/ringtone_phonk.mp3
    - assets/audio/ringtone_fadded.mp3
    - assets/audio/ringtone_pop.mp3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
