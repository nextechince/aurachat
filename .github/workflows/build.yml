name: Build AURA CHAT

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Create Cloudinary config
        run: |
          cat > lib/services/cloudinary_config.dart << 'EOF'
          class CloudinaryConfig {
            static const String cloudName = '${{ secrets.CLOUDINARY_CLOUD_NAME }}';
            static const String apiKey = '${{ secrets.CLOUDINARY_API_KEY }}';
            static const String apiSecret = '${{ secrets.CLOUDINARY_API_SECRET }}';
          }
          EOF

      - name: Create API config with Gemini key
        run: |
          cat > lib/services/api_config.dart << 'EOF'
          class ApiConfig {
            static const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';
          }
          EOF

      - name: Create asset directories
        run: |
          mkdir -p assets/images assets/emojis assets/audio

      - name: Fix pubspec.yaml
        run: |
          cat > pubspec.yaml << 'EOF'
          name: aurachat
          description: AURA Chat App
          publish_to: 'none'

          version: 3.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter

            firebase_core: ^2.24.2
            firebase_auth: ^4.16.0
            cloud_firestore: ^4.14.0
            firebase_database: ^10.3.0
            firebase_storage: ^11.2.5
            firebase_messaging: ^14.6.5
            cloudinary_public: ^0.23.1
            provider: ^6.1.2
            google_generative_ai: ^0.4.6
            cupertino_icons: ^1.0.8
            image_picker: ^1.0.7
            intl: ^0.18.1
            google_fonts: ^6.2.1
            cached_network_image: ^3.3.0
            photo_view: ^0.14.0
            share_plus: ^7.2.2
            uni_links: ^0.5.1
            crypto: ^3.0.3
            local_auth: ^2.1.8
            intl_phone_field: ^3.2.0
            http: ^1.2.2
            uuid: ^4.5.0
            emoji_picker_flutter: ^2.0.0
            file_picker: ^6.1.1
            path_provider: ^2.1.0
            open_filex: ^4.3.4
            just_audio: ^0.9.36
            record: ^5.0.0
            video_player: ^2.8.1
            dio: ^5.4.0
            path: ^1.8.3
            url_launcher: ^6.2.1
            agora_rtc_engine: ^6.3.0
            permission_handler: ^11.0.1
            shared_preferences: ^2.2.2
            flutter_local_notifications: ^17.0.0
            connectivity_plus: ^5.0.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
            flutter_launcher_icons: ^0.13.1

          flutter:
            uses-material-design: true
            assets:
              - assets/images/
              - assets/emojis/
              - assets/audio/
              - assets/audio/ringtone_ambition.mp3
              - assets/audio/ringtone_phonk.mp3
              - assets/audio/ringtone_fadded.mp3
              - assets/audio/ringtone_pop.mp3

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/images/logo.png"
            adaptive_icon_background: "#0A0A0F"
            adaptive_icon_foreground: "assets/images/logo.png"
            min_sdk_android: 21
          EOF

      - name: Clean and Get dependencies
        run: |
          rm -f pubspec.lock
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: v${{ github.run_number }}
          name: "AURA CHAT v${{ github.run_number }}"
          body: "AURA CHAT Release - Works on all Android 5.0+ phones"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Create API config with Gemini key
        run: |
          cat > lib/services/api_config.dart << 'EOF'
          class ApiConfig {
            static const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';
          }
          EOF

      - name: Clean and Get dependencies
        run: |
          rm -f pubspec.lock
          flutter clean
          flutter pub get

      - name: Build Web
        run: |
          flutter config --enable-web
          flutter build web --release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
