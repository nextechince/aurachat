name: Build AURA CHAT

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'  # ✅ This has Dart 3.3.0+
          channel: 'stable'
          cache: true

      - name: Check Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create Cloudinary config
        run: |
          cat > lib/services/cloudinary_config.dart << 'EOF'
          class CloudinaryConfig {
            static const String cloudName = '${{ secrets.CLOUDINARY_CLOUD_NAME }}';
            static const String apiKey = '${{ secrets.CLOUDINARY_API_KEY }}';
            static const String apiSecret = '${{ secrets.CLOUDINARY_API_SECRET }}';
          }
          EOF

      - name: Create API config with Gemini key
        run: |
          cat > lib/services/api_config.dart << 'EOF'
          class ApiConfig {
            static const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';
          }
          EOF

      - name: Create asset directories
        run: |
          mkdir -p assets/images assets/emojis assets/audio

      - name: Clean and Get dependencies
        run: |
          rm -f pubspec.lock
          flutter clean
          flutter pub get

      - name: Build ONE APK for ALL phones
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: v${{ github.run_number }}
          name: "AURA CHAT v${{ github.run_number }}"
          body: "AURA CHAT Release - Works on all Android 5.0+ phones"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
          cache: true

      - name: Create API config with Gemini key
        run: |
          cat > lib/services/api_config.dart << 'EOF'
          class ApiConfig {
            static const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';
          }
          EOF

      - name: Clean and Get dependencies
        run: |
          rm -f pubspec.lock
          flutter clean
          flutter pub get

      - name: Build Web
        run: |
          flutter config --enable-web
          flutter build web --release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
