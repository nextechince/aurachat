<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Channel - AURA Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #ffffff;
            min-height: 100vh;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%),
                #0A0A0F;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            min-height: 100vh;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
        }

        /* ─── HEADER ────────────────────────────────────────────── */
        .header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }

        .header .back {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }

        .header .title {
            flex: 1;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .create-btn {
            background: none;
            border: none;
            color: #06B6D4;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            padding: 8px 16px;
            border-radius: 12px;
            transition: background 0.3s ease;
        }

        .header .create-btn:hover {
            background: rgba(6, 182, 212, 0.1);
        }

        .header .create-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .header .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── CONTENT ────────────────────────────────────────────── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* ─── AVATAR ────────────────────────────────────────────── */
        .avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 2px solid rgba(139, 92, 246, 0.2);
        }

        .avatar:hover { transform: scale(1.05); }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar .placeholder {
            font-size: 50px;
            color: #8B5CF6;
        }

        .avatar .camera-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0A0A0F;
        }

        .avatar .camera-btn i {
            font-size: 14px;
            color: #fff;
        }

        .avatar-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 8px;
            cursor: pointer;
        }

        .avatar-label:hover { color: rgba(255, 255, 255, 0.6); }

        /* ─── INPUTS ────────────────────────────────────────────── */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .input-group .input-wrap {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: border 0.3s ease;
            overflow: hidden;
        }

        .input-group .input-wrap:focus-within {
            border-color: #8B5CF6;
        }

        .input-group .input-wrap i {
            padding: 0 14px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
        }

        .input-group input,
        .input-group textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 18px 16px 18px 0;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
            resize: none;
            min-height: 56px;
        }

        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .input-group textarea { min-height: 80px; }

        /* ─── CHANNEL INFO BANNER ────────────────────────────────── */
        .info-banner {
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-banner .icon {
            padding: 10px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 50%;
            color: #8B5CF6;
            font-size: 20px;
        }

        .info-banner .text h4 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .info-banner .text p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin: 0;
        }

        /* ─── LINK GENERATED ────────────────────────────────────── */
        .link-generated {
            display: none;
            padding: 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            margin-bottom: 16px;
            align-items: center;
            gap: 8px;
        }

        .link-generated.show { display: flex; }

        .link-generated i { color: #10B981; font-size: 16px; }
        .link-generated .link-text {
            font-size: 12px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ─── SELECTED MEMBERS ───────────────────────────────────── */
        .selected-members {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 0 16px;
            min-height: 90px;
        }

        .selected-members .member {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .selected-members .member .avatar-sm {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-size: 18px;
            color: #fff;
            font-weight: 600;
        }

        .selected-members .member .avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .selected-members .member .remove-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ef4444;
            border: none;
            color: #fff;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .selected-members .member .name {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ─── SEARCH RESULTS ────────────────────────────────────── */
        .search-result {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .search-result:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .search-result .avatar-sm {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            font-size: 16px;
            color: #fff;
            font-weight: 600;
        }

        .search-result .avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .search-result .info {
            flex: 1;
            min-width: 0;
        }

        .search-result .info .name {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }

        .search-result .info .email {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .search-result .check {
            color: #8B5CF6;
            font-size: 20px;
        }

        .search-result .add {
            color: rgba(255, 255, 255, 0.3);
            font-size: 20px;
        }

        /* ─── RESPONSIVE ──────────────────────────────────────────── */
        @media (max-width: 640px) {
            .app { max-width: 100%; }
            .content { padding: 16px; }
            .header .title { font-size: 20px; }
            .avatar { width: 80px; height: 80px; }
            .avatar .placeholder { font-size: 36px; }
        }

        /* ─── SCROLLBAR ──────────────────────────────────────────── */
        .content::-webkit-scrollbar,
        .selected-members::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        .content::-webkit-scrollbar-track,
        .selected-members::-webkit-scrollbar-track {
            background: transparent;
        }

        .content::-webkit-scrollbar-thumb,
        .selected-members::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="app">

        <!-- ─── HEADER ────────────────────────────────────────────── -->
        <div class="header">
            <button class="back" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="title">New Channel</div>
            <button class="create-btn" id="createBtn" onclick="createChannel()">Create</button>
        </div>

        <!-- ─── CONTENT ────────────────────────────────────────────── -->
        <div class="content" id="content">

            <!-- ─── AVATAR ────────────────────────────────────────── -->
            <div class="avatar-wrapper">
                <div class="avatar" id="avatar" onclick="pickPhoto()">
                    <span class="placeholder" id="avatarPlaceholder"><i class="fas fa-bullhorn"></i></span>
                    <img id="avatarImg" style="display:none;" />
                    <div class="camera-btn"><i class="fas fa-camera"></i></div>
                </div>
                <span class="avatar-label" onclick="pickPhoto()">
                    <i class="fas fa-camera"></i> Tap to add photo
                </span>
            </div>

            <!-- ─── NAME ───────────────────────────────────────────── -->
            <div class="input-group">
                <label>Channel Name</label>
                <div class="input-wrap">
                    <i class="fas fa-edit"></i>
                    <input type="text" id="channelName" placeholder="Enter channel name" />
                </div>
            </div>

            <!-- ─── DESCRIPTION ────────────────────────────────────── -->
            <div class="input-group">
                <label>Description</label>
                <div class="input-wrap">
                    <i class="fas fa-align-left"></i>
                    <textarea id="channelDesc" placeholder="Add a description (optional)" rows="2"></textarea>
                </div>
            </div>

            <!-- ─── INVITE LINK NAME ──────────────────────────────── -->
            <div class="input-group">
                <label>Invitation Link Name</label>
                <div class="input-wrap">
                    <i class="fas fa-link"></i>
                    <input type="text" id="inviteName" placeholder="e.g., my-awesome-channel (optional)" />
                </div>
            </div>

            <!-- ─── INFO BANNER ────────────────────────────────────── -->
            <div class="info-banner">
                <div class="icon"><i class="fas fa-bullhorn"></i></div>
                <div class="text">
                    <h4>One-Way Messaging</h4>
                    <p>Only admins and owner can post messages</p>
                </div>
            </div>

            <!-- ─── LINK GENERATED ────────────────────────────────── -->
            <div class="link-generated" id="linkGenerated">
                <i class="fas fa-check-circle"></i>
                <span class="link-text" id="generatedLink">Link: aurachat.app/invite/abc123</span>
            </div>

            <!-- ─── SEARCH USERS ──────────────────────────────────── -->
            <div class="input-group">
                <label>Add Subscribers</label>
                <div class="input-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search users to add..." oninput="searchUsers(this.value)" />
                </div>
            </div>

            <!-- ─── SELECTED MEMBERS ──────────────────────────────── -->
            <div class="selected-members" id="selectedMembers"></div>

            <!-- ─── SEARCH RESULTS ─────────────────────────────────── -->
            <div id="searchResults"></div>

        </div>

    </div>

    <script>
        // ─── FIREBASE CONFIG ──────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDJV5x8PKgWhHBaavZ6z9rB3DuT3TEFtLA",
            authDomain: "aurachat-85f54.firebaseapp.com",
            projectId: "aurachat-85f54",
            storageBucket: "aurachat-85f54.firebasestorage.app",
            messagingSenderId: "539789121540",
            appId: "1:539789121540:web:96ac597e52dd0a80573d51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // ─── CLOUDINARY CONFIG ──────────────────────────────────────
        const CLOUDINARY_CLOUD_NAME = 'dn2mwp1lc';
        const CLOUDINARY_UPLOAD_PRESET = 'aura_chat';

        // ─── STATE ─────────────────────────────────────────────────────
        let selectedMembers = [];
        let searchResults = [];
        let channelPhotoUrl = null;
        let currentUserId = null;
        let generatedLink = null;

        // ─── DOM REFS ──────────────────────────────────────────────────
        const channelName = document.getElementById('channelName');
        const channelDesc = document.getElementById('channelDesc');
        const inviteName = document.getElementById('inviteName');
        const searchInput = document.getElementById('searchInput');
        const selectedMembersEl = document.getElementById('selectedMembers');
        const searchResultsEl = document.getElementById('searchResults');
        const createBtn = document.getElementById('createBtn');
        const avatarImg = document.getElementById('avatarImg');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');
        const linkGenerated = document.getElementById('linkGenerated');
        const generatedLinkEl = document.getElementById('generatedLink');

        // ─── AUTH ──────────────────────────────────────────────────────
        auth.onAuthStateChanged(function(user) {
            if (user) {
                currentUserId = user.uid;
            } else {
                const mockUser = localStorage.getItem('aura_user');
                if (mockUser) {
                    currentUserId = mockUser;
                } else {
                    window.location.href = '/email_verification.html';
                }
            }
        });

        // ─── PICK PHOTO ──────────────────────────────────────────────
        function pickPhoto() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async function(e) {
                const file = e.target.files[0];
                if (!file) return;

                createBtn.disabled = true;
                createBtn.innerHTML = '<span class="spinner"></span>';

                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                    formData.append('folder', `aurachat/permanent/avatars/channels/${currentUserId || 'temp'}`);

                    const response = await fetch(
                        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                        { method: 'POST', body: formData }
                    );
                    const data = await response.json();

                    if (data.secure_url) {
                        channelPhotoUrl = data.secure_url;
                        avatarImg.src = data.secure_url;
                        avatarImg.style.display = 'block';
                        avatarPlaceholder.style.display = 'none';
                    } else {
                        throw new Error('Upload failed');
                    }
                } catch (e) {
                    console.error('Photo upload error:', e);
                    alert('Photo upload failed. Continuing without photo.');
                }

                createBtn.disabled = false;
                createBtn.textContent = 'Create';
            };
            input.click();
        }

        // ─── SEARCH USERS ─────────────────────────────────────────────
        async function searchUsers(query) {
            if (!query || query.trim().length < 2) {
                searchResults = [];
                renderSearchResults();
                return;
            }

            try {
                const snapshot = await db.collection('users')
                    .where('username', '>=', query.trim())
                    .where('username', '<=', query.trim() + '\uf8ff')
                    .limit(20)
                    .get();

                searchResults = snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(u => u.id !== currentUserId);

                renderSearchResults();
            } catch (e) {
                console.error('Search error:', e);
            }
        }

        // ─── TOGGLE MEMBER ────────────────────────────────────────────
        function toggleMember(user) {
            const index = selectedMembers.findIndex(m => m.id === user.id);
            if (index >= 0) {
                selectedMembers.splice(index, 1);
            } else {
                selectedMembers.push(user);
            }
            renderSelectedMembers();
            renderSearchResults();
        }

        // ─── RENDER SELECTED MEMBERS ─────────────────────────────────
        function renderSelectedMembers() {
            if (selectedMembers.length === 0) {
                selectedMembersEl.innerHTML = '';
                return;
            }

            selectedMembersEl.innerHTML = selectedMembers.map(m => `
                <div class="member">
                    <div class="avatar-sm">
                        ${m.avatar_url ? `<img src="${m.avatar_url}" />` : m.username ? m.username.charAt(0).toUpperCase() : 'U'}
                        <button class="remove-btn" onclick="toggleMember({id:'${m.id}',username:'${m.username}',avatar_url:'${m.avatar_url}'})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <span class="name">${m.username || 'Unknown'}</span>
                </div>
            `).join('');
        }

        // ─── RENDER SEARCH RESULTS ────────────────────────────────────
        function renderSearchResults() {
            if (searchResults.length === 0) {
                searchResultsEl.innerHTML = '';
                return;
            }

            searchResultsEl.innerHTML = searchResults.map(user => {
                const isSelected = selectedMembers.some(m => m.id === user.id);
                return `
                    <div class="search-result" onclick="toggleMember({id:'${user.id}',username:'${user.username || 'Unknown'}',avatar_url:'${user.avatar_url || ''}'})">
                        <div class="avatar-sm">
                            ${user.avatar_url ? `<img src="${user.avatar_url}" />` : (user.username ? user.username.charAt(0).toUpperCase() : 'U')}
                        </div>
                        <div class="info">
                            <div class="name">${user.username || 'Unknown'}</div>
                            <div class="email">${user.email || ''}</div>
                        </div>
                        <i class="fas ${isSelected ? 'fa-check-circle check' : 'fa-plus-circle add'}"></i>
                    </div>
                `;
            }).join('');
        }

        // ─── CREATE CHANNEL ────────────────────────────────────────────
        async function createChannel() {
            const name = channelName.value.trim();
            if (!name) {
                alert('Please enter a channel name');
                return;
            }

            createBtn.disabled = true;
            createBtn.innerHTML = '<span class="spinner"></span>';

            try {
                if (!currentUserId) {
                    throw new Error('Not authenticated');
                }

                const participants = [currentUserId, ...selectedMembers.map(m => m.id)];
                const participantsData = {};
                participants.forEach(id => {
                    participantsData[id] = {
                        role: id === currentUserId ? 'owner' : 'subscriber',
                        joined_at: firebase.firestore.FieldValue.serverTimestamp()
                    };
                });

                const chatId = 'channel_' + Date.now();

                await db.collection('chats').doc(chatId).set({
                    id: chatId,
                    name: name,
                    description: channelDesc.value.trim() || null,
                    avatar_url: channelPhotoUrl || null,
                    type: 'channel',
                    created_by: currentUserId,
                    created_by_email: auth.currentUser?.email || '',
                    participants: participants,
                    participants_data: participantsData,
                    member_count: participants.length,
                    banned_users: [],
                    settings: {
                        chat_disabled: false,
                        file_sharing_disabled: false,
                        slow_mode_seconds: 0,
                        restrict_new_members_minutes: 0,
                        message_retention_days: 0,
                        welcome_message: `Welcome to ${name}!`,
                        rules: 'Be respectful and kind to all members.',
                        announcements_only: true,
                        polls_enabled: true,
                        reactions_enabled: true,
                        forwarding_enabled: true,
                        voice_chat_enabled: false
                    },
                    pinned_messages: [],
                    created_at: firebase.firestore.FieldValue.serverTimestamp(),
                    updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message_at: firebase.firestore.FieldValue.serverTimestamp(),
                    last_message: 'Channel created'
                });

                // Generate invitation link
                try {
                    const link = await generateInvitationLink(chatId, name);
                    generatedLink = link;
                    linkGenerated.classList.add('show');
                    generatedLinkEl.textContent = `🔗 ${link}`;
                } catch (e) {
                    console.error('Invitation creation failed:', e);
                }

                alert('Channel created successfully! 🎉');

                // Go back to chats
                window.location.href = '/chats.html';

            } catch (e) {
                console.error('Create channel error:', e);
                alert('Error creating channel: ' + e.message);
            }

            createBtn.disabled = false;
            createBtn.textContent = 'Create';
        }

        // ─── GENERATE INVITATION LINK ────────────────────────────────
        async function generateInvitationLink(chatId, chatName) {
            // This would call your backend or Firestore function
            // For now, generate a simple link
            const inviteId = 'invite_' + Date.now();
            await db.collection('invitations').doc(inviteId).set({
                chat_id: chatId,
                chat_name: chatName,
                chat_type: 'channel',
                created_by: currentUserId,
                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                uses: 0,
                max_uses: -1
            });

            return `${window.location.origin}/invite/${inviteId}`;
        }

        // ─── ENTER KEY TO CREATE ──────────────────────────────────────
        channelName.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                channelDesc.focus();
            }
        });

        channelDesc.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                inviteName.focus();
            }
        });

        inviteName.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchUsers(searchInput.value);
            }
        });

        console.log('📢 AURA Chat — Create Channel (HTML)');
    </script>

</body>
</html>
